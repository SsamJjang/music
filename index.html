/* ============================================================
   PLAYBACK (YouTube IFrame player)
   ============================================================ */
/* Two engines: YouTube IFrame (official, but blocked for many mainstream/VEVO
   videos and on file://) and an <audio> element fed by a Piped audio stream
   (plays anything, anywhere). We try YT first, then fall back to audio. */
const audio = new Audio(); audio.preload='auto'; audio.volume=1;
let engine='yt';        // 'yt' | 'audio'
let ytStarted=false;    // did YT actually begin the current track?
let watchdog=null;      // catches silent YT failures (e.g. file://)
let preferAudio=false;  // once YT proves it can't embed here, stop trying it
let embedFails=0, failStreak=0, ticker=null;
let audioWorked=false;  // has the Piped fallback ever actually produced sound?

function stopWatchdog(){ clearTimeout(watchdog); clearInterval(watchdog); watchdog=null; }
/* A pre-roll ad runs inside this same embed BEFORE the song, and the API doesn't
   report PLAYING for the track until that ad finishes — which can take 30s. A fixed
   deadline therefore fires on every ad and kills a player that was working fine.
   Instead poll for signs of life (clock moving, or state playing/buffering — an ad
   counts as all three) and only bail when the embed has been truly inert. */
function armWatchdog(){
  stopWatchdog();
  let last=-1, idle=0;
  watchdog=setInterval(()=>{
    if(engine!=='yt'||ytStarted){ stopWatchdog(); return; }
    let now=-1, st=-99;
    try{ now=player.getCurrentTime(); st=player.getPlayerState(); }catch(e){}
    if(now!==last||st===YT.PlayerState.PLAYING||st===YT.PlayerState.BUFFERING) idle=0; else idle++;
    last=now;
    // 5s was too short and was a large part of the "randomly doesn't load".
    // YouTube's ad-check path does not merely delay the track -- while it is hanging
    // the embed sits in UNSTARTED with the clock at 0, which is indistinguishable
    // from dead by every signal above, and a blocked check regularly runs past five
    // seconds. So the watchdog was shooting working players and handing the track to
    // Piped, which by this file's own account is mostly dead: a slow song became a
    // failed one. Waiting longer costs a few seconds in the genuinely-dead case; not
    // waiting costs the track.
    if(idle>=12){ stopWatchdog(); fallbackToAudio(); }
  },1000);
}

/* ---------- two players: one audible, one warming up the next track ----------
   A fresh loadVideoById stalls ~5s before audio starts (YouTube's ad-check path
   hangs when a blocker is active), but an auto-advance after a track ENDS doesn't.
   So the visible delay isn't work we can make faster — it's a wait we can move.
   A second hidden player loads the next track while the current one is still
   playing, eats the stall in the background, then parks paused at 0. Pressing
   Next just swaps which instance is audible. */
let players=[], active=0, preloadId=null, preloadReady=false, preloadT=null;
function standby(){ return players[1-active]; }
function mkPlayer(divId){
  return new YT.Player(divId,{
    height:'66',width:'66',host:'https://www.youtube.com',
    // origin is what lets the player skip a chunk of its own handshake; it must be
    // omitted on file://, where the origin is the string "null" and passing it makes
    // the embed refuse to load at all.
    playerVars:Object.assign(
      {controls:0,disablekb:1,modestbranding:1,playsinline:1,rel:0},
      /^https?:$/.test(location.protocol)?{origin:location.origin}:{}
    ),
    events:{
      onReady:()=>{ytReady=true;try{player.setVolume(volume);}catch(e){}},
      onStateChange:e=>{ (e.target===player) ? onPlayerState(e) : onStandbyState(e); },
      onError:e=>{ if(e.target===player) onPlayerErr(e); else { preloadId=null; preloadReady=false; } }
    }
  });
}
function onYouTubeIframeAPIReady(){
  players=[mkPlayer('yt-player'), mkPlayer('yt-player-2')];
  player=players[0];
}
/* Which track Next would pick. Shuffle draws from a pre-built pass, so it's
   predictable too — only the track after a pass ends goes unpreloaded, since
   that one comes out of a reshuffle that hasn't happened yet. */
function peekNextIndex(){
  if(!queue.length) return -1;
  if(shuffle){
    if(shufflePos<0||shufflePos>=shuffleOrder.length-1) return -1;
    return queue.findIndex(t=>t.id===shuffleOrder[shufflePos+1]);
  }
  if(qIndex<queue.length-1) return qIndex+1;
  return repeat===1 ? 0 : -1;
}
/* Put a track into the standby player. The stall is YouTube's ad-check timing out
   against the blocker, and it is the same length whoever asks for it -- so the only
   thing that makes a song start faster is having asked EARLIER. Everything below is
   a different guess about when "earlier" is. */
function warmTrack(id){
  if(!id||!ytReady||preferAudio) return;
  if(id===preloadId) return;                          // already warming this one
  const cur=queue[qIndex];
  if(cur&&cur.id===id&&engine==='yt') return;         // it is the audible track already
  preloadId=id; preloadReady=false;
  try{ const sb=standby(); sb.mute(); sb.loadVideoById(id); }
  catch(e){ preloadId=null; }
}
function preloadNext(){
  const i=peekNextIndex(); if(i<0) return;
  const nx=queue[i]; if(!nx) return;
  warmTrack(nx.id);
}

/* Warming what the POINTER is over, which is the only advance notice a click gives.
   A row click was the worst case in the whole player: the next track gets warmed
   while the current one plays, but a song picked out of a list is cold every time,
   and that is the several-second wait that reads as "it takes so long to load a
   song now".

   Hovering is not a promise to click, so this is debounced -- a pointer crossing a
   list on its way somewhere else must not fire a load per row -- and it is allowed
   to displace the next-track warm-up: an explicit hover is a much better prediction
   than the queue order, and the next track gets warmed again from the PLAYING
   handler anyway. pointerdown warms immediately and without the debounce, which
   covers a touch (no hover to work from) and a fast, decisive click. */
let hoverWarmT=null, warmRestoreT=null;
function warmFromEvent(e,instant){
  if(!e.target||!e.target.closest) return;
  // The like, add and remove buttons live inside a row and do not play it. Warming
  // from those would hand the standby a track nobody asked for and quietly cost the
  // real next track its head start.
  if(e.target.closest('button')) return;
  const host=e.target.closest('[data-id]');
  const id=host&&host.dataset&&host.dataset.id;
  clearTimeout(hoverWarmT);
  if(!id) return;
  if(instant) warmTrack(id);
  else hoverWarmT=setTimeout(()=>warmTrack(id),200);
  // A hover that never becomes a click has taken the standby away from the track
  // that is actually coming next. Give it back if nothing has happened since.
  clearTimeout(warmRestoreT);
  warmRestoreT=setTimeout(()=>{ if(preloadId===id) preloadNext(); },10000);
}
document.addEventListener('pointerover',e=>warmFromEvent(e,false),{passive:true});
document.addEventListener('pointerdown',e=>warmFromEvent(e,true),{passive:true});
document.addEventListener('pointerout',e=>{
  if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-id]')) clearTimeout(hoverWarmT);
},{passive:true});
/* The standby player is muted and offscreen: let it run far enough to prove the
   stall is over, then park it at 0 so the swap starts the track from the top. */
function onStandbyState(e){
  if(e.data!==YT.PlayerState.PLAYING||preloadReady) return;
  preloadReady=true;
  try{ e.target.pauseVideo(); e.target.seekTo(0,true); }catch(err){}
}
function swapToStandby(){
  const old=player;
  active=1-active; player=players[active];
  try{ old.stopVideo(); }catch(e){}
  try{
    // Only if it is not already at the top. The standby parks itself at 0 when it
    // finishes warming, and seeking a paused player to where it already is still
    // costs a rebuffer -- which is a gap, in the one path that exists to remove one.
    let at=0; try{ at=player.getCurrentTime()||0; }catch(err){}
    if(at>0.5) player.seekTo(0,true);
    if(muted) player.mute(); else { player.unMute(); player.setVolume(volume); }
    player.playVideo();
  }catch(e){ preloadId=null; preloadReady=false; fallbackToAudio(); return; }
  preloadId=null; preloadReady=false;
  armWatchdog();
}
function onPlayerState(e){
  if(engine!=='yt')return; const S=YT.PlayerState;
  if(e.data===S.PLAYING){ytStarted=true;embedFails=0;failStreak=0;ytRetriedId=null;isPlaying=true;setPlayIcon(true);startTicker();stopWatchdog();try{player.setPlaybackRate(playbackRate);}catch(e){}
    // 1.5s, not 4s. The standby is muted and loading in parallel, so the only reason

/* Codes that say this video will never play in this embed, whatever we do:

   maybe, and under an ad blocker a maybe is usually a timeout on the ad check

let ytRetriedId=null;
function onPlayerErr(e){

  // up TO is Piped, which this file already documents as largely dead -- so treating
  // a transient error as fatal turned a track that would have played on the second
  // ask into a track that did not play at all. One retry only: a video that is
  // genuinely broken must not loop.
  if(t&&code!==undefined&&!YT_DEAD_CODES.has(code)&&ytRetriedId!==t.id){
    ytRetriedId=t.id;
    try{ player.loadVideoById(t.id); armWatchdog(); return; }catch(err){}
  }

function playCurrent(){
  const t=queue[qIndex]; if(!t)return;

  // so the songs the pass had already stepped over still get their turn

  pulseLoad(t);

  engine='yt'; ytStarted=false; try{audio.pause();}catch(e){} showThumb(false);
  clearTimeout(preloadT);

  // head start on the stall, and swapping to it is at worst exactly a cold load --
  // which is what the other branch does. Requiring "ready" meant a track that was
  // 90% of the way through warming got thrown away and started again from nothing,
  // and that is the gap that showed up on a fast skip or a short song.

async function toAudio(){
  const t=queue[qIndex]; if(!t)return;

  engine='audio'; $('#np-artist').textContent=(t.artist||'')+' · loading…';

    const url=await pipedStreamUrl(t.id);

/* The public Piped network is largely dead and YouTube bot-blocks what's left, so

async function pipedStreamUrl(id){

  catch(e){ pipedStreamMisses++; throw e; }

  const a=(d.audioStreams||[]).slice().sort((x,y)=>(y.bitrate||0)-(x.bitrate||0));

/* ---------- shuffled pass ----------

function buildShuffleOrder(startId,avoidFirstId){
  const ids=queue.map(t=>t.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  if(startId){ const k=ids.indexOf(startId); if(k>0){ids.splice(k,1);ids.unshift(startId);} }

  else if(avoidFirstId&&ids.length>1&&ids[0]===avoidFirstId){const j=1+Math.floor(Math.random()*(ids.length-1));[ids[0],ids[j]]=[ids[j],ids[0]];}

/* ============================================================
   LYRICS (LRCLIB — free, synced) + FULL SCREEN NOW PLAYING
   ============================================================ */
function splitAT(t){
  let a=(t.artist||'').replace(/\s*-\s*topic$/i,'').replace(/vevo$/i,'').replace(/\s*-\s*official.*$/i,'').replace(/\bofficial\b/i,'').trim();
  let ti=cleanTitle(t.title||'');
  const m=ti.match(/^(.*?)\s[-–—]\s(.*)$/); if(m){ if(!a)a=m[1].trim(); ti=m[2].trim(); }
  ti=ti.replace(/\(.*?\)|\[.*?\]/g,'').trim()||ti;
  ti=ti.replace(/\s*\b(feat|ft|featuring)\b\.?.*$/i,'').trim()||ti;   // "Song Featuring X" misses both lyrics and sleeve lookups
  return {artist:a,track:ti};
}
/* Pure fetch (the beat engine also reads lyrics, to phase-lock its grid). Only

   a slow LRCLIB answer must not hand an old song's lyrics to the new one. */
const lyMem={};
function fetchLyrics(t){
  if(customLyrics[t.id]!=null) return Promise.resolve(parseCustomLRC(customLyrics[t.id]));
  const ck='ly|'+t.id;
  if(cache[ck]) return Promise.resolve(cache[ck].items);
  if(lyMem[t.id]) return lyMem[t.id];
  const {artist,track}=splitAT(t);
  return lyMem[t.id]=(async()=>{
    let ly=null;
    try{
      const r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(((artist?artist+' ':'')+track).trim()));
      const arr=await r.json();
      const withSync=Array.isArray(arr)?arr.filter(x=>x.syncedLyrics):[];
      const pool=withSync.length?withSync:(Array.isArray(arr)?arr.filter(x=>x.plainLyrics):[]);
      ly=pool.length?parseLRC(pool[0]):null;
    }catch(e){ ly=null; }
    cache[ck]={items:ly,ts:Date.now()}; persistCache(); return ly;
  })().finally(()=>{delete lyMem[t.id];});
}
async function loadLyrics(t){
  const ly=await fetchLyrics(t);
  if(queue[qIndex]&&queue[qIndex].id===t.id){ lyrics=ly; lyricIdx=-1; }
  return ly;
}
/* user-supplied .lrc/plain text, saved per track id — takes priority over LRCLIB */
function parseCustomLRC(text){ return /\[\d+:\d+/.test(text)?parseLRC({syncedLyrics:text}):parseLRC({plainLyrics:text}); }
function parseLRC(item){
  if(item.syncedLyrics){
    const out=[];
    item.syncedLyrics.split('\n').forEach(line=>{
      const tags=line.match(/\[(\d+):(\d+(?:\.\d+)?)\]/g); if(!tags)return;
      const txt=line.replace(/\[[^\]]*\]/g,'').trim();
      tags.forEach(tag=>{const mm=tag.match(/\[(\d+):(\d+(?:\.\d+)?)\]/);out.push({t:parseInt(mm[1])*60+parseFloat(mm[2]),txt});});
    });
    out.sort((a,b)=>a.t-b.t);
    return {synced:true,lines:out};
  }
  return {synced:false,lines:(item.plainLyrics||'').split('\n').map(txt=>({t:null,txt}))};
}
function syncLyrics(cur){
  const ov=$('#np-full'); if(!ov||ov.style.display==='none'||!lyrics||!lyrics.synced)return;
  const box=$('#npf-lyrics'); if(!box)return;
  let idx=-1; for(let i=0;i<lyrics.lines.length;i++){ if(lyrics.lines[i].t<=cur+0.12) idx=i; else break; }
  if(idx===lyricIdx)return; lyricIdx=idx;
  box.querySelectorAll('.lyric-line.active').forEach(l=>{
    l.classList.remove('active'); l.style.removeProperty('--wipe');
    l.querySelectorAll('.kw').forEach(w=>{w.style.removeProperty('--wf');});
  });
  const a=box.querySelector('.lyric-line[data-i="'+idx+'"]');
  activeLine=a||null; if(a&&idx>=0) pulse.swell=1;          // a new line swells the stage a little
  if(a){a.classList.add('active'); if(lyricSettings.mode!=='zen') centerLyric(box,a,true);}
}
let activeLine=null;
/* Scroll ONLY the lyrics box. scrollIntoView() walks up and scrolls every
   scrollable ancestor — including #np-full, which is overflow:hidden but still
   programmatically scrollable — which pushed the top bar (and the close button)
   out of the viewport as the lyrics progressed. */
function centerLyric(box,a,smooth){
  const br=box.getBoundingClientRect(), ar=a.getBoundingClientRect();
  const target=box.scrollTop+(ar.top-br.top)-(box.clientHeight-a.offsetHeight)/2;
  const max=Math.max(0,box.scrollHeight-box.clientHeight);
  box.scrollTo({top:Math.max(0,Math.min(max,target)),behavior:smooth?'smooth':'auto'});

/* per-frame karaoke fill — smooth, interpolated between the coarse player clock (run by the stage loop) */
function karaokeFrame(){
  if(lyricSettings.mode==='karaoke'&&lyrics&&lyrics.synced&&lyricIdx>=0){
    const s=lyrics.lines[lyricIdx].t, e=(lyrics.lines[lyricIdx+1]?lyrics.lines[lyricIdx+1].t:s+3);
    const prog=Math.max(0,Math.min(1,(estTime()-s)/Math.max(.1,e-s)));
    const box=$('#npf-lyrics'), a=box&&box.querySelector('.lyric-line[data-i="'+lyricIdx+'"]');
    if(a){
      const words=a.querySelectorAll('.kw'), pos=prog*words.length, done=Math.floor(pos);
      words.forEach((ws,wi)=>{

        ws.style.setProperty('--wf',wf.toFixed(1)+'%');

async function paFor(t,m,bpm){

/* Lyric lines mostly start on a beat, so their timestamps phase-lock the grid:

  const id=t.id; tapTimes=[];

  const tp=taps[id]; if(tp) Object.assign(beat,{bpm:tp.bpm,phase:tp.phase,bar:tp.bar||0,src:'tap'});
  updateBeatChip();
  (async()=>{
    try{
      const m=await dzMeta(t); if(beat.id!==id) return;
      const bpm=m?await dzBpm(t,m):0; if(beat.id!==id) return;
      if(bpm&&beat.src!=='tap'){ beat.bpm=bpm; beat.src='tempo'; updateBeatChip(); }
      const pa=m?await paFor(t,m,bpm):null; if(beat.id!==id) return;
      if(pa){ beat.k=pa.k; beat.h=pa.h; beat.energy=pa.energy; if(beat.src!=='tap'){ beat.bpm=pa.bpm; beat.src='tempo'; } }

/* T, in time with the music: four taps lock a grid for this song (and it's remembered) */
function tapBeat(){
  const t=queue[qIndex]; if(!t||!isPlaying){ toast('Play a song, then tap T along with it'); return; }

  tapTimes.push(now); pulse.tap=1; wakeLoop();
  if(tapTimes.length<4){ updateBeatChip('Tap '+(4-tapTimes.length)+' more…'); return; }
  const iv=[]; for(let i=1;i<tapTimes.length;i++) iv.push(tapTimes[i]-tapTimes[i-1]);
  const P=iv.slice().sort((a,b)=>a-b)[iv.length>>1]; if(P<.25||P>1.6) return;
  let s=0,c=0; tapTimes.forEach(x=>{const a=2*Math.PI*x/P; s+=Math.sin(a); c+=Math.cos(a);});
  let ph=Math.atan2(s,c)/(2*Math.PI)*P; if(ph<0) ph+=P;

  taps[t.id]={bpm:+(60/P).toFixed(2),phase:+ph.toFixed(3),bar}; persistTaps();

async function startLive(){

  let st;

        audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},
        preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude',systemAudio:'include'}); }
  catch(e){ if(e&&e.name!=='NotAllowedError') toast('Couldn’t start live sync'); return; }

  if(!at){ st.getTracks().forEach(x=>x.stop()); toast('Choose this tab and switch on “Share tab audio”'); return; }
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(new MediaStream([at])), an=ac.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.45;
    const mute=ac.createGain(); mute.gain.value=0;           // keeps the graph pulling without playing it twice

}
function stopLive(){ if(!live) return; const L=live; live=null;

  if(!s){
    if(live){ s='Live'+(live.bpm?' · '+live.bpm+' BPM':''); tip='Following this tab’s real audio. Click to stop.'; }
    else if(beat.src==='tap'){ s='Tapped · '+Math.round(beat.bpm)+' BPM'; tip='The beat you tapped for this song. Tap T again to re-lock it.'; }
    else if(beat.bpm){ s=(beat.fit?'':'~')+Math.round(beat.bpm)+' BPM'; tip='Tempo from the song'+(beat.fit?', phase-locked to the lyrics':' (not yet locked to the beat)')+'. Tap T on the beat to lock it exactly, or turn on Live sync.'; }

function beatMenu(e){
  const t=queue[qIndex], items=[];

  });
  const up=e=>{
    const d=St.drag; if(!d) return; St.drag=null; c3.classList.remove('dragging');
    const dx=d.x-d.x0, h=d.h, vx=h.length>1?(h[h.length-1][1]-h[0][1])/Math.max(1,h[h.length-1][0]-h[0][0]):0;
    if(!d.moved){ if(e.type==='pointerup'&&performance.now()-d.t0<450) coverTap(); return; }
    if(Math.abs(dx)>St.size*.36||Math.abs(vx)>.6) stageFling((Math.abs(vx)>.6?vx:dx)<0?-1:1);
  };
  c3.addEventListener('pointerup',up); c3.addEventListener('pointercancel',up);
  ov.addEventListener('pointermove',e=>{ St.ptr={x:e.clientX,y:e.clientY,t:performance.now()}; Liquid.pointer(e.clientX/innerWidth,e.clientY/innerHeight); stagePoke(); },{passive:true});
  ov.addEventListener('pointerdown',e=>{ stagePoke();
    if(e.target.closest('button,.c3,.npf-lyrics,.npf-settings,.npf-title,.npf-artist')) return;
    Liquid.splash(e.clientX/innerWidth,e.clientY/innerHeight,1); });
  addEventListener('resize',()=>{St.rectT=0;});
}
/* any sign of the listener brings the chrome back; stillness lets the music have the screen */
function stagePoke(){
  document.body.classList.remove('stage-idle'); clearTimeout(stagePoke.t);
  stagePoke.t=setTimeout(()=>{ if(stageIsOpen()&&!$('#npf-settings').classList.contains('open')&&!$('#ctx-menu')&&!$('.modal-bg'))
    document.body.classList.add('stage-idle'); },3500);
}
function coverTap(){
  const willPlay=!isPlaying; togglePlay();
  const f=St.el.flash; f.innerHTML=willPlay?'<svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
                                           :'<svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  const r=St.el.c3.getBoundingClientRect(); Liquid.splash((r.left+r.width/2)/innerWidth,(r.top+r.height/2)/innerHeight,1.2);
  St.sp.s.v-=1.4;                                        // a little squash under the finger
}
function stageFling(dir){                                // dir -1: thrown left → next · +1: thrown right → previous
  const s=St.sp, id=St.id; St.flung=dir;
  s.x.t=dir*innerWidth*.85; s.ry.t=dir*70; s.rz.t=dir*8; s.y.t=-20;
  setTimeout(()=>{
    if(dir<0) playNext(); else playPrev(true);
    setTimeout(()=>{ if(St.id===id&&St.flung){ St.flung=0; toast(dir<0?'That’s the end of the queue':'Already at the first song'); } },600);
  },200);
}
function loadArt(url,t){
  const tries=[url,tImgHi(t),tImg(t)].filter((u,i,a)=>u&&a.indexOf(u)===i);
  return new Promise(res=>{ const go=i=>{ if(i>=tries.length) return res(tries[tries.length-1]||'');
    const im=new Image();
    // YouTube answers a missing maxres with a 120px grey placeholder, not an error
    im.onload=()=>{ if(im.naturalWidth<=120&&i<tries.length-1) go(i+1); else res(tries[i]); };
    im.onerror=()=>go(i+1); im.src=tries[i]; }; go(0); });
}
function setCoverArt(url){ St.el.img.src=url; St.el.label.style.backgroundImage=url?'url("'+url+'")':''; }
function stageShow(t,instant){
  if(!St.el) return;
  if(St.id===t.id&&!instant) return;                     // same song re-rendered (e.g. lyrics edited)
  const tok=St.id=t.id, dir=navDir;
  if(instant){                                            // opening the stage: show something now, upgrade when the sleeve arrives
    setCoverArt(artSync(t,'s'));
    artFor(t,1500).then(a=>loadArt(a.big,t)).then(u=>{ if(St.id===tok) setCoverArt(u); });
    return;
  }
  const t0=performance.now(), s=St.sp;
  if(!St.flung){ St.leaving=true;                         // the old sleeve leaves while the new one loads
    if(dir){ s.x.t=-dir*innerWidth*.8; s.ry.t=-dir*60; s.rz.t=-dir*5; } else { s.s.t=.6; s.y.t=80; s.rx.t=-25; } }
  const from=dir||(St.flung?-St.flung:0);
  artFor(t,900).then(a=>loadArt(a.big,t)).then(url=>{
    if(St.id!==tok) return;
    setTimeout(()=>{ if(St.id!==tok) return; setCoverArt(url); stageEnter(from); },Math.max(0,260-(performance.now()-t0)));
  });
}
function stageEnter(dir){
  const s=St.sp; St.leaving=false; St.flung=0; for(const k in s) s[k].v=0;
  if(dir){ s.x.c=dir*innerWidth*.7; s.ry.c=dir*50; s.rz.c=dir*4; s.y.c=0; s.s.c=1; s.rx.c=0; }
  else{ s.x.c=0; s.ry.c=0; s.rz.c=0; s.s.c=.72; s.y.c=60; s.rx.c=22; }
}
function stageIntro(){
  const s=St.sp; for(const k in s) s[k].v=0;
  s.x.c=0; s.ry.c=-12; s.rz.c=0; s.y.c=innerHeight*.32; s.s.c=.5; s.rx.c=40; St.leaving=false; St.flung=0; St.rectT=0;
  const n=+(localStorage.getItem('freefy_stage_hint')||0), h=St.el.hint;
  if(n<4){ localStorage.setItem('freefy_stage_hint',n+1); h.classList.remove('gone'); clearTimeout(stageIntro.t); stageIntro.t=setTimeout(()=>h.classList.add('gone'),5500); }
  else h.classList.add('gone');
}
function stageFrame(dt,now){
  const E=St.el; if(!E) return;
  const s=St.sp, d=St.drag, react=reactAmt();
  if(now-St.rectT>500){ St.rect=E.c3.getBoundingClientRect(); St.rectT=now; St.size=St.rect.width||St.size; }
  if(d){ const dx=d.x-d.x0, dy=d.y-d.y0; s.x.t=dx; s.y.t=dy*.3; s.ry.t=dx*.16; s.rx.t=-dy*.1; s.rz.t=dx*.012; s.s.t=1.03; }
  else if(!St.leaving&&!St.flung){
    const r=St.rect, p=St.ptr, cx=r.left+r.width/2, cy=r.top+r.height/2;
    if(now-p.t<2600){                                    // lean toward the pointer, a little more when you're over it
      const nx=Math.max(-1.3,Math.min(1.3,(p.x-cx)/(r.width*.9))), ny=Math.max(-1.3,Math.min(1.3,(p.y-cy)/(r.height*.9)));
      s.ry.t=nx*15; s.rx.t=-ny*11; s.x.t=nx*8; s.y.t=ny*5; s.rz.t=0; s.s.t=(Math.abs(nx)<.56&&Math.abs(ny)<.56)?1.035:1;
    }else{                                               // left alone, it floats
      s.ry.t=Math.sin(now/2100)*8; s.rx.t=Math.sin(now/2900)*4; s.x.t=0; s.y.t=Math.sin(now/1700)*7; s.rz.t=Math.sin(now/3300)*1.2; s.s.t=1;
    }
  }
  const k=d?520:150, damp=d?40:15;                       // ~0.6 damping off the finger: a liquid wobble
  for(const key in s) stepSpr(s[key],dt,k,damp);
  const v=pulse.beat*react;
  E.rig.style.transform=`translate3d(${s.x.c.toFixed(1)}px,${s.y.c.toFixed(1)}px,0) rotateX(${s.rx.c.toFixed(2)}deg) rotateY(${s.ry.c.toFixed(2)}deg) rotateZ(${s.rz.c.toFixed(2)}deg) scale(${(s.s.c+v*.05).toFixed(4)})`;
  E.glare.style.setProperty('--gx',(50+s.ry.c*2.4).toFixed(1)+'%'); E.glare.style.setProperty('--gy',(45-s.rx.c*2.8).toFixed(1)+'%');
  E.glare.style.opacity=(.3+Math.min(.4,(Math.abs(s.rx.c)+Math.abs(s.ry.c))*.015)+v*.25).toFixed(3);
  E.sheen.style.transform=`translateX(${(-s.ry.c*2.2).toFixed(1)}%)`;
  // the record slides out and spins while it plays, tucks back in and slows to a stop on pause
  St.vx+=((isPlaying?36:12)-St.vx)*Math.min(1,dt*2.2);
  St.vs+=((isPlaying?120*playbackRate:0)-St.vs)*Math.min(1,dt*1.4); St.va=(St.va+St.vs*dt)%360;
  E.vwrap.style.transform=`translateZ(-9px) translateX(${St.vx.toFixed(2)}%)`;
  E.vinyl.style.transform=`rotate(${St.va.toFixed(1)}deg)`;
  E.floor.style.opacity=(.38+v*.3+pulse.energy*.12).toFixed(3);
  E.floor.style.transform=`translateX(${(s.x.c*.5).toFixed(1)}px) scale(${(1+v*.14).toFixed(3)})`;
  // on each bar's "one" the sleeve drops a ring into the liquid
  if(pulse.down&&isPlaying&&react>0&&St.rect){ const r=St.rect;
    Liquid.splash((r.left+r.width/2)/innerWidth,(r.top+r.height/2)/innerHeight,.45*react*(.5+pulse.energy*.5)); }
}

/* ---------- one loop drives every moving thing; it sleeps when nothing moves ---------- */
let loopRAF=0, loopLast=0;
function wakeLoop(){ if(!loopRAF){ loopLast=performance.now(); loopRAF=requestAnimationFrame(loop); } }
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-loopLast)/1000)); loopLast=now;
  pulseFrame(dt,now);
  const v=(pulse.beat*reactAmt()).toFixed(3), open=stageIsOpen();
  if(open){
    karaokeFrame(); stageFrame(dt,now);
    if(activeLine) activeLine.style.setProperty('--beat',v);
    const bd=$('#npf-bdot'); if(bd) bd.style.transform='scale('+(1+v*.9).toFixed(3)+')';
    if(Liquid.ok&&$('#np-full').classList.contains('bg-liquid')) Liquid.frame(dt,now);
  }
  // only the full-screen stage reacts to the beat; with it closed the loop sleeps
  if(!open){ loopRAF=0; return; }
  loopRAF=requestAnimationFrame(loop);
}

/* ---------- covers in grids lean toward the pointer and catch the light ---------- */
let tiltCard=null, tiltRAF=0, tiltEv=null;
function resetTilt(c){ c.classList.remove('tilt'); c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg'); }
document.addEventListener('pointermove',e=>{ if(e.pointerType==='touch'||reduceMotion) return; tiltEv=e;
  if(!tiltRAF) tiltRAF=requestAnimationFrame(()=>{
    tiltRAF=0; const ev=tiltEv, c=ev.target&&ev.target.closest&&ev.target.closest('.card');
    if(tiltCard&&tiltCard!==c) resetTilt(tiltCard);
    tiltCard=c; if(!c) return;
    const r=c.querySelector('.art').getBoundingClientRect();
    const nx=Math.max(-.6,Math.min(.6,(ev.clientX-r.left)/r.width-.5)), ny=Math.max(-.6,Math.min(.6,(ev.clientY-r.top)/r.height-.5));
    c.classList.add('tilt');
    c.style.setProperty('--ry',(nx*18).toFixed(2)+'deg'); c.style.setProperty('--rx',(-ny*18).toFixed(2)+'deg');
    c.style.setProperty('--gx',((nx+.5)*100).toFixed(1)+'%'); c.style.setProperty('--gy',((ny+.5)*100).toFixed(1)+'%');
  });
},{passive:true});
document.addEventListener('pointerout',e=>{ if(!e.relatedTarget&&tiltCard){ resetTilt(tiltCard); tiltCard=null; } },{passive:true});

/* ============================================================
   WIRE UP
   ============================================================ */
let searchTimer=null;
$('#search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>runSearch(),450);});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);runSearch();}});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');curType=b.dataset.type;
  if(lastQuery){$('#search').value=lastQuery;runSearch();}});
document.addEventListener('keydown',e=>{
  if(e.code==='Escape'){closeMenu();closeFullNP();return;}
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowRight'&&e.shiftKey)playNext();
  if(e.code==='ArrowLeft'&&e.shiftKey)playPrev();
  if(e.code==='KeyL')openFullNP();
  if(e.code==='KeyM')toggleMute();
  if(e.code==='KeyT'&&!e.repeat)tapBeat();});

(function(){const s=el('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);})();

renderLibrary();
initBackup();
if(!apiKeys.length) showKeyModal();
showHome();
</script>
