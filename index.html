<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freefy — Free Music Player</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%231db954'/%3E%3Cpath d='M8 15.5V8l7 3-7 4.5z' fill='%23000'/%3E%3C/svg%3E">
<style>
  /* registered so the whole app can glide from one album's colors to the next */
  @property --accent{syntax:'<color>';inherits:true;initial-value:#1db954}
  @property --tint{syntax:'<color>';inherits:true;initial-value:#1f1f1f}
  :root{
    --bg:#000; --panel:#121212; --panel2:#181818; --panel-hover:#282828;
    --text:#fff; --muted:#b3b3b3; --accent:#1db954; --accent-hover:color-mix(in srgb,var(--accent) 82%,#fff);
    --bar:#181818; --border:#2a2a2a; --tint:#1f1f1f;
    transition:--accent 1.4s ease,--tint 1.8s ease;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit}
  ::-webkit-scrollbar{width:12px}
  ::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:6px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#787878;background-clip:content-box}

  /* Layout */
  #app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr 90px;height:100vh;gap:8px;padding:8px;background:var(--bg)}
  #sidebar{grid-row:1/2;display:flex;flex-direction:column;gap:8px;overflow:hidden}
  #main{grid-row:1/2;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 62%,#121212) 0%,var(--panel) 340px);border-radius:8px;overflow-y:auto;position:relative}
  #nowbar{grid-column:1/3;background:var(--bar);border-radius:8px;display:flex;align-items:center;padding:0 16px;gap:16px;position:relative;z-index:41}

  /* Sidebar */
  .side-box{background:var(--panel);border-radius:8px;padding:8px 12px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;padding:8px;letter-spacing:-.5px}
  .logo svg{width:30px;height:30px}
  .nav{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
  .nav button{display:flex;align-items:center;gap:16px;padding:8px;border-radius:6px;color:var(--muted);font-weight:700;font-size:15px;transition:color .2s}
  .nav button:hover,.nav button.active{color:var(--text)}
  .nav button svg{width:24px;height:24px;flex-shrink:0}

  .lib{background:var(--panel);border-radius:8px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .lib-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px;color:var(--muted);font-weight:700;font-size:15px}
  .lib-add{width:30px;height:30px;border-radius:50%;font-size:22px;line-height:1;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .lib-add:hover{color:#fff;background:var(--panel-hover)}
  .lib-list{overflow-y:auto;flex:1;padding:0 6px}
  .lib-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:6px;cursor:pointer}
  .lib-item:hover,.lib-item.active{background:var(--panel-hover)}
  .lib-item .li-meta{flex:1;min-width:0}
  .eq{display:flex;align-items:flex-end;gap:2px;height:15px;flex-shrink:0}
  .eq i{width:3px;height:4px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
  .eq i:nth-child(1){animation-delay:-.2s} .eq i:nth-child(2){animation-delay:-.6s} .eq i:nth-child(3){animation-delay:-.35s}
  @keyframes eq{0%,100%{height:4px}50%{height:15px}}
  .lib-cover{width:48px;height:48px;border-radius:4px;overflow:hidden;flex-shrink:0;background:#333;display:flex;align-items:center;justify-content:center}
  .lib-cover img{width:100%;height:100%;object-fit:cover}
  .lib-cover.heart{background:linear-gradient(135deg,#4a1fb8,#c33764)}
  .li-meta{min-width:0}
  .li-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .backup-btn{display:block;width:calc(100% - 16px);margin:0 8px;padding:9px;border-radius:6px;background:#232323;color:var(--muted);font-size:12px;font-weight:700;text-align:center}
  .backup-btn:hover{color:#fff;background:#2e2e2e}
  .backup-btn.on{color:var(--accent)}
  .lib-footer{display:flex;gap:8px;padding:8px}
  .lib-footer button{flex:1;font-size:12px;font-weight:600;color:var(--muted);padding:9px;border-radius:6px;background:#232323}
  .lib-footer button:hover{color:#fff;background:#2e2e2e}
  .side-empty{color:var(--muted);font-size:13px;padding:12px 14px;line-height:1.6}

  /* Topbar / search */
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:16px 24px;background:rgba(18,18,18,.6);backdrop-filter:blur(12px)}
  .search-wrap{position:relative;flex:0 1 420px}
  .search-wrap>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#000}
  #search{width:100%;border-radius:500px;border:none;background:#fff;color:#000;padding:12px 16px 12px 42px;font-size:15px;font-weight:500;outline:none}
  #search::placeholder{color:#535353}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:500px;background:#232323;color:var(--text);font-weight:600;font-size:14px;transition:background .2s}
  .tab:hover{background:#2e2e2e}
  .tab.active{background:var(--text);color:#000}

  /* Content */
  .content{padding:8px 24px 40px}
  .section-title{font-size:24px;font-weight:800;margin:24px 0 6px}
  .source-badge{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:6px}
  .source-badge .refresh{margin-left:6px;color:var(--accent);cursor:pointer;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
  .card{background:var(--panel2);border-radius:8px;padding:16px;transition:background .3s;cursor:pointer;position:relative}
  .card:hover{background:var(--panel-hover)}
  .card .art{position:relative;width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);background:#333;
    transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s cubic-bezier(.2,.9,.2,1.2),box-shadow .4s}
  .card.tilt .art{transition:transform .12s ease-out,box-shadow .4s;box-shadow:0 22px 44px rgba(0,0,0,.6)}
  .card .art::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
    background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.34),transparent 55%);mix-blend-mode:overlay}
  .card.tilt .art::after{opacity:1}
  .card.artist .art{border-radius:50%}
  .card .art img{width:100%;height:100%;object-fit:cover;display:block}
  .card .c-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .c-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .play-fab{position:absolute;right:22px;bottom:82px;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:.3s;box-shadow:0 8px 16px rgba(0,0,0,.4)}
  .card:hover .play-fab{opacity:1;transform:translateY(0)}
  .card .play-fab:hover{background:var(--accent-hover);transform:scale(1.05)}

  /* Track rows */
  .rows{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:14px;padding:8px 12px;border-radius:6px;cursor:pointer}
  .row:hover{background:var(--panel-hover)}
  .row.playing .r-title{color:var(--accent)}
  .row .r-idx{color:var(--muted);font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
  .row:hover .r-idx .num{display:none}
  .row .r-idx .ico{display:none}
  .row:hover .r-idx .ico{display:inline-flex}
  .row .r-main{display:flex;align-items:center;gap:12px;min-width:0}
  .row .r-main img{width:40px;height:40px;border-radius:4px;object-fit:cover;flex-shrink:0}
  .row .r-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .r-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-actions{display:flex;align-items:center;gap:16px}
  .r-add,.r-remove{opacity:0;color:var(--muted);display:flex}
  .row:hover .r-add,.row:hover .r-remove{opacity:1}
  .r-add:hover,.r-remove:hover{color:#fff}
  .r-like{opacity:0;color:var(--muted);display:flex}
  .row:hover .r-like{opacity:1}
  .r-like.liked{opacity:1;color:var(--accent)}

  /* Now playing */
  .np-left{display:flex;align-items:center;gap:12px;width:30%;min-width:180px}
  /* the mini cover stays still: a soft glow in the song's colour, never pulsing */
  #yt-holder{width:66px;height:66px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#000;position:relative;
    box-shadow:0 0 0 1px rgba(255,255,255,.07),0 6px 18px rgba(0,0,0,.45),0 0 22px -6px color-mix(in srgb,var(--accent) 45%,transparent);
    transition:box-shadow 1.4s ease}
  #yt-holder iframe{width:100%;height:100%;border:0;pointer-events:none}
  #yt-holder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .np-info{min-width:0}
  .np-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np-btn{color:var(--muted);flex-shrink:0;display:flex}
  .np-btn:hover{color:#fff}
  .np-btn.liked{color:var(--accent)}
  .np-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:722px;margin:0 auto}
  .controls{display:flex;align-items:center;gap:22px}
  .controls button{color:var(--muted);display:flex;align-items:center;justify-content:center;transition:color .2s,transform .1s}
  .controls button:hover{color:var(--text)}
  .controls button:active{transform:scale(.92)}
  .controls button.on{color:var(--accent)}
  .btn-play{width:36px;height:36px;border-radius:50%;background:var(--text)!important;color:#000!important}
  .btn-play:hover{transform:scale(1.06)}
  .progress{display:flex;align-items:center;gap:10px;width:100%}
  .progress .t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
  .bar{flex:1;height:4px;background:#4d4d4d;border-radius:3px;position:relative;cursor:pointer;transition:height .15s}
  .bar:hover{height:6px}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--text);border-radius:3px;width:0%}
  .bar:hover .fill{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,#fff),var(--accent));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
  .bar .knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:#fff;opacity:0;left:0;box-shadow:0 0 10px rgba(0,0,0,.4)}
  .bar:hover .knob{opacity:1}
  .np-right{width:30%;min-width:180px;display:flex;align-items:center;justify-content:flex-end;gap:12px}
  .vol{display:flex;align-items:center;gap:8px;width:130px}
  .vol .bar{max-width:100px}

  /* States */
  .center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 20px;color:var(--muted);gap:10px}
  .center-msg>svg{width:56px;height:56px;opacity:.5}
  .center-msg h2{color:var(--text);font-size:22px}
  .spinner{width:40px;height:40px;border:4px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .quota-warn{background:#3a1212;color:#ff9b9b;padding:12px 16px;border-radius:8px;margin:16px 0;font-size:14px;line-height:1.5}

  /* Menu / toast / modal */
  .menu{position:fixed;z-index:200;background:#282828;border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,.6);padding:4px;min-width:210px;max-height:320px;overflow-y:auto;font-size:14px}
  .menu-head{padding:8px 12px 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .menu-item{padding:10px 12px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
  .menu-item:hover{background:#3e3e3e}
  .toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;font-weight:700;padding:12px 22px;border-radius:500px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s}
  @keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:#181818;border-radius:12px;max-width:560px;width:100%;padding:32px;max-height:90vh;overflow-y:auto}
  .modal h1{font-size:26px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .modal p{color:var(--muted);line-height:1.6;margin-bottom:16px;font-size:15px}
  .modal ol{color:var(--muted);line-height:1.8;margin:0 0 20px 20px;font-size:14px}
  .modal ol a{color:var(--accent);text-decoration:underline}
  .modal input{width:100%;padding:14px;border-radius:8px;border:1px solid #444;background:#000;color:#fff;font-size:15px;margin-bottom:14px;outline:none}
  .modal input:focus{border-color:var(--accent)}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end}
  .btn{padding:12px 28px;border-radius:500px;font-weight:700;font-size:15px;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-green{background:var(--accent);color:#000}
  .btn-green:hover{background:var(--accent-hover)}
  .btn-ghost{background:#333;color:#fff}
  .btn-ghost:hover{background:#444}
  .btn-danger{background:transparent;color:var(--muted);font-weight:700;padding:12px 18px}
  .btn-danger:hover{color:#ff6b6b}
  .modal-err{color:#ff7b7b;font-size:14px;margin-bottom:12px;min-height:18px}

  .now-btn{color:var(--muted);display:flex;align-items:center;justify-content:center}
  .now-btn:hover{color:#fff}
  .now-btn.on{color:var(--accent)}

  /* fullscreen now playing + reactive lyrics */
  #np-full{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;padding:14px 40px 106px;overflow:hidden;color:#fff;
    --fx1:#3a3a55;--fx2:#22323f;--fx3:#101018;--lsz:1;--lalign:left;background:#0a0a0a}
  .npf-bg{position:absolute;inset:0;z-index:0}
  #np-full.bg-ambient .npf-bg{background:
      radial-gradient(60% 60% at 22% 25%,var(--fx1),transparent 60%),
      radial-gradient(55% 55% at 80% 28%,var(--fx2),transparent 60%),
      radial-gradient(75% 75% at 50% 95%,var(--fx3),transparent 65%),#0b0b10;
    filter:saturate(1.15);animation:drift 20s ease-in-out infinite alternate}
  #np-full.bg-vivid .npf-bg{background:linear-gradient(130deg,var(--fx1),var(--fx2),var(--fx3),var(--fx1));background-size:300% 300%;animation:flow 15s ease infinite}
  #np-full.bg-blur .npf-bg{background-size:cover;background-position:center;filter:blur(70px) brightness(.45) saturate(1.4);transform:scale(1.35)}
  #np-full.bg-dark .npf-bg{background:linear-gradient(180deg,#1b1b1b,#000)}
  @keyframes drift{0%{transform:scale(1.05) translate(0,0)}100%{transform:scale(1.16) translate(-3%,-2%)}}
  @keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .npf-scrim{position:absolute;inset:0;z-index:1;background:radial-gradient(130% 90% at 50% 0%,transparent,rgba(0,0,0,.4));pointer-events:none}
  .npf-top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center}
  .npf-close,.npf-gear,.npf-editlyrics{font-size:18px;color:rgba(255,255,255,.7);padding:6px 12px;border-radius:6px}
  .npf-close:hover,.npf-gear:hover,.npf-editlyrics:hover{color:#fff;background:#ffffff1f}
  .npf-inner{position:relative;z-index:2;flex:1;display:flex;gap:48px;min-height:0;align-items:center;justify-content:center}
  .npf-side{flex:1;max-width:620px;display:flex;flex-direction:column;min-height:0;height:100%;padding:12px 0}
  .npf-title{font-size:32px;font-weight:800;line-height:1.15;text-shadow:0 2px 20px rgba(0,0,0,.4)}
  .npf-artist{font-size:17px;color:rgba(255,255,255,.75);margin:8px 0 14px;cursor:pointer;width:fit-content}
  .npf-artist:hover{color:#fff;text-decoration:underline}
  /* horizontal padding gives the active-line glow room to bleed without being
     clipped; overflow-x hidden (not auto) stops long lines forcing a scrollbar */
  .npf-lyrics{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 32px;text-align:var(--lalign);line-height:1.8;-webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 86%,transparent);scrollbar-width:none}
  .npf-lyrics::-webkit-scrollbar{display:none}
  .lyric-line{color:rgba(255,255,255,.42);font-weight:800;font-size:calc(26px*var(--lsz));transition:color .3s,opacity .3s,transform .3s,filter .3s;cursor:pointer;padding:5px 0;letter-spacing:-.01em;overflow-wrap:break-word;word-break:break-word}
  .lyric-line:hover{color:rgba(255,255,255,.7)}
  .lyric-line.active{color:#fff}
  #np-full.glow .lyric-line.active{text-shadow:0 0 calc(24px + var(--beat,0)*26px) rgba(255,255,255,.5)}
  #np-full.mode-focus .lyric-line{opacity:.32;filter:blur(.4px)}
  #np-full.mode-focus .lyric-line.active{opacity:1;filter:none;transform:scale(1.06);transform-origin:var(--lalign) center}
  #np-full.mode-zen .npf-lyrics{display:flex;align-items:center;justify-content:center;-webkit-mask-image:none}
  #np-full.mode-zen .lyric-line{display:none;font-size:calc(40px*var(--lsz));text-align:center;line-height:1.3}
  #np-full.mode-zen .lyric-line.active{display:block;animation:zen .5s ease}
  @keyframes zen{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  /* Karaoke: fill word-by-word so the highlight follows the natural wrap
     (finishes line 1, then moves to line 2) instead of a single horizontal
     wipe smeared across every wrapped row at once.
     Every word — lit, current, or upcoming — uses the same gradient-clip
     render path (only --wf differs). Previously "lit"/"cur" swapped between
     a plain `color` and a background-clip:text gradient, and that render-mode
     switch can't be transitioned, so each word boundary popped/flashed. */
  #np-full.mode-karaoke .lyric-line.active .kw{
    background:linear-gradient(90deg,#fff var(--wf,0%),rgba(255,255,255,.34) var(--wf,0%));
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .npf-settings{position:absolute;top:52px;right:24px;z-index:5;width:272px;background:rgba(24,24,28,.94);backdrop-filter:blur(16px);border:1px solid #ffffff1f;border-radius:12px;padding:16px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .npf-settings.open{display:block}
  .set-row{margin-bottom:14px}.set-row:last-child{margin-bottom:0}
  .set-row>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:7px;font-weight:800}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{flex:1;min-width:calc(50% - 3px);padding:8px;border-radius:7px;background:#2a2a30;color:#ddd;font-size:13px;font-weight:600}
  .seg button.on{background:var(--accent);color:#000}
  .set-size{display:flex;align-items:center;gap:12px}
  .set-size button{width:34px;height:34px;border-radius:7px;background:#2a2a30;font-size:18px;font-weight:800}
  .set-size span{font-weight:700;min-width:44px;text-align:center}

  /* home */
  .greeting{font-size:30px;font-weight:800;margin:22px 0 8px}
  .row-title{font-size:22px;font-weight:800;margin:26px 0 14px}
  .row-title.link{cursor:pointer}.row-title.link:hover{text-decoration:underline}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
  .chip{padding:8px 15px;border-radius:500px;background:#232323;font-weight:600;font-size:14px;cursor:pointer}
  .chip:hover{background:#2e2e2e}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  .tile{position:relative;height:96px;border-radius:8px;overflow:hidden;cursor:pointer;padding:14px;font-weight:800;font-size:18px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .tile:hover{filter:brightness(1.1)}
  .hrow{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px}
  .hrow .card{min-width:170px;max-width:170px}

  /* reorder + menu */
  .r-move{display:flex;flex-direction:column;opacity:0;margin-right:2px}
  .row:hover .r-move{opacity:1}
  .r-move button{color:var(--muted);line-height:.7;font-size:13px;padding:0 2px}
  .r-move button:hover{color:#fff}
  .menu-sep{height:1px;background:#3a3a3a;margin:4px 6px}

  /* ---------- the playing row breathes ---------- */
  .row .r-idx .rq{display:none;height:14px;justify-content:center}
  body.is-playing .row.playing:not(:hover) .r-idx .num{display:none}
  body.is-playing .row.playing:not(:hover) .r-idx .rq{display:inline-flex}
  .row.playing .r-idx .num{color:var(--accent)}

  /* ---------- views ease in instead of popping ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .content.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .content.enter .row,.content.enter .grid>.card,.content.enter .tile{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*18ms)}

  /* ---------- coverflow (home · recently played) ---------- */
  .flow{position:relative;height:340px;margin:0 -24px;overflow:hidden;outline:none;user-select:none;touch-action:pan-y}
  .flow-stage{position:absolute;left:0;right:0;top:14px;height:220px;perspective:1100px;transform-style:preserve-3d}
  .fl-item{position:absolute;left:50%;top:0;width:200px;height:200px;margin-left:-100px;cursor:pointer;will-change:transform}
  .fl-art{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#222;box-shadow:0 18px 40px rgba(0,0,0,.55);
    -webkit-box-reflect:below 5px linear-gradient(transparent 66%,rgba(255,255,255,.2))}
  .fl-art img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .fl-play{position:absolute;right:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;
    opacity:0;transform:translateY(8px) scale(.9);transition:.3s;box-shadow:0 8px 18px rgba(0,0,0,.45)}
  .fl-item.center:hover .fl-play{opacity:1;transform:none}
  .flow-cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;padding:0 60px;transition:opacity .25s}
  .flow-cap .ft{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow-cap .fa{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flow-nav{position:absolute;top:96px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-size:24px;line-height:1;z-index:200;opacity:0;transition:opacity .25s,background .2s}
  .flow:hover .flow-nav,.flow:focus-visible .flow-nav{opacity:1}
  .flow-nav:hover{background:rgba(0,0,0,.8)}
  .flow-nav.prev{left:30px}.flow-nav.next{right:30px}

  /* ---------- full-screen stage ---------- */
  #np-full{opacity:0;transition:opacity .45s ease}
  #np-full.shown{opacity:1}
  .npf-gl{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:none}
  #np-full.bg-liquid .npf-gl{display:block}
  #np-full.bg-liquid .npf-bg{background:#07070b}
  #np-full.bg-liquid .npf-scrim{background:radial-gradient(120% 90% at 50% 0%,transparent 45%,rgba(0,0,0,.42)),linear-gradient(90deg,transparent 30%,rgba(0,0,0,.26))}
  .npf-top{transition:opacity .6s}
  .npf-top-r{display:flex;align-items:center;gap:6px}
  .npf-beat{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:rgba(255,255,255,.82);padding:7px 13px;border-radius:500px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);font-variant-numeric:tabular-nums}
  .npf-beat:hover{background:rgba(255,255,255,.16);color:#fff}
  .npf-beat .bdot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .npf-beat.live .bdot{background:#ff4d6d;box-shadow:0 0 12px #ff4d6d}

  .c3{--S:min(44vh,400px);position:relative;width:var(--S);height:var(--S);flex-shrink:0;perspective:1300px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .c3{margin-right:calc(var(--S)*.3)}            /* room for the record sliding out of its sleeve */
  .c3.dragging{cursor:grabbing}
  .c3-floor{position:absolute;left:-12%;right:-12%;bottom:calc(var(--S)*-.24);height:calc(var(--S)*.34);border-radius:50%;pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,var(--c1,#666),transparent 72%);filter:blur(26px);opacity:.5}
  .c3-rig{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .c3-vwrap{position:absolute;inset:3%;transform-style:preserve-3d;transform:translateZ(-9px)}
  .c3-vinyl{position:absolute;inset:0;border-radius:50%;box-shadow:0 14px 40px rgba(0,0,0,.65);
    background:radial-gradient(circle,#0b0b0b 0 3%,transparent 3.4%),repeating-radial-gradient(circle,#0d0d0f 0 1.5px,#19191c 2px 3px),#111}
  .c3-label{position:absolute;inset:32%;border-radius:50%;background:#333 center/cover;box-shadow:0 0 0 3px #0b0b0b}
  .c3-label::after{content:'';position:absolute;left:50%;top:50%;width:9%;height:9%;margin:-4.5% 0 0 -4.5%;border-radius:50%;background:#050505}
  .c3-vshine{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.13) 13%,transparent 19% 52%,rgba(255,255,255,.1) 60%,transparent 67%)}
  .c3-back{position:absolute;inset:0;border-radius:4px;transform:translateZ(-5px);background:linear-gradient(135deg,color-mix(in srgb,var(--c1,#333) 60%,#000),#050505)}
  .c3-side{position:absolute;background:linear-gradient(180deg,color-mix(in srgb,var(--c1,#333) 45%,#111),#0a0a0a)}
  .c3-side.r,.c3-side.l{width:10px;height:100%;top:0;left:calc(50% - 5px)}
  .c3-side.t,.c3-side.b{height:10px;width:100%;left:0;top:calc(50% - 5px)}
  .c3-side.r{transform:rotateY(90deg) translateZ(calc(var(--S)/2))}
  .c3-side.l{transform:rotateY(-90deg) translateZ(calc(var(--S)/2))}
  .c3-side.t{transform:rotateX(90deg) translateZ(calc(var(--S)/2))}
  .c3-side.b{transform:rotateX(-90deg) translateZ(calc(var(--S)/2))}
  .c3-face{position:absolute;inset:0;border-radius:4px;overflow:hidden;transform:translateZ(5px);background:#222;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
  .c3-face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:opacity .35s}
  .c3-glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
    background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.55),rgba(255,255,255,0) 50%)}
  .c3-sheen{position:absolute;inset:-60%;pointer-events:none;mix-blend-mode:screen;
    background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.14) 49%,rgba(255,255,255,.05) 52%,transparent 58%)}
  .c3-flash{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.38);backdrop-filter:blur(6px);color:#fff;opacity:0;pointer-events:none}
  .c3-flash.go{animation:flash .7s ease-out}
  @keyframes flash{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
  .c3-hint{position:absolute;left:0;right:0;bottom:calc(var(--S)*-.2 - 8px);text-align:center;font-size:12px;letter-spacing:.4px;color:rgba(255,255,255,.55);pointer-events:none;transition:opacity 1s}
  .c3-hint.gone{opacity:0}

  /* the bar turns to glass over the stage, and everything steps back when you just listen */
  body.stage-open #nowbar{background:rgba(14,14,20,.36);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.35);transition:opacity .8s,background .4s}
  body.stage-idle #np-full{cursor:none}
  body.stage-idle .npf-top,body.stage-idle .c3-hint{opacity:0}
  body.stage-idle #nowbar{opacity:.14}
  body.stage-idle #nowbar:hover{opacity:1;transition:opacity .2s}
  @media (prefers-reduced-motion:reduce){ .content.enter>*,.content.enter .row,.content.enter .grid>.card,.content.enter .tile{animation:none} }

  @media(max-width:820px){
    #app{grid-template-columns:1fr}
    #sidebar{display:none}
    #nowbar{grid-column:1/2}
    .np-right{display:none}
    .np-left{width:auto}
    #np-full{padding:14px 18px 106px}
    .npf-inner{flex-direction:column;gap:18px;justify-content:flex-start}
    .c3{--S:min(220px,56vw);margin-top:6px}
    .c3-hint{display:none}
    .flow-nav{display:none}
    .npf-side{height:auto;flex:1;min-height:0}
  }
</style>
</head>
<body>

<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="side-box">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#1db954"/><path d="M8 15.5V8l7 3-7 4.5z" fill="#000"/></svg>
        Freefy
      </div>
      <nav class="nav">
        <button id="nav-home" class="active" onclick="showHome()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.3 3 10v11h6v-6h6v6h6V10z"/></svg> Home
        </button>
        <button id="nav-search" onclick="document.getElementById('search').focus()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 2a8 8 0 105.3 14l5.4 5.3 1.4-1.4-5.3-5.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg> Search
        </button>
      </nav>
    </div>

    <div class="lib">
      <div class="lib-head">
        <span>Your Library</span>
        <button class="lib-add" title="Create playlist" onclick="createPlaylist()">+</button>
      </div>
      <div id="lib-list" class="lib-list"></div>
      <button id="backup-btn" class="backup-btn" onclick="backupClick()" title="Keep a live JSON copy of your library on disk">💾 Auto-save to file: Off</button>
      <button id="backup-open-btn" class="backup-btn" style="margin-top:4px;font-size:11px" onclick="openExistingBackup()" title="Already have a Freefy backup file? Point auto-save at it instead of starting a new one">📂 Use existing file…</button>
      <div class="lib-footer">
        <button onclick="exportLibrary()" title="Download your playlists & likes as a file">⬇ Export</button>
        <button onclick="importLibrary()" title="Restore from a file">⬆ Import</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main id="main">
    <div class="topbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 2a8 8 0 105.3 14l5.4 5.3 1.4-1.4-5.3-5.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
        <input id="search" type="text" placeholder="Search, or paste a YouTube link" autocomplete="off">
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-type="song">Songs</button>
        <button class="tab" data-type="artist">Artists</button>
        <button class="tab" data-type="album">Albums</button>
      </div>
      <button class="tab" id="btn-keys" title="Manage API keys" onclick="showKeyModal()" style="margin-left:auto">Keys</button>
    </div>
    <div class="content" id="content"></div>
  </main>

  <!-- Now Playing -->
  <footer id="nowbar">
    <div class="np-left">
      <div id="yt-holder" title="Full screen" onclick="openFullNP()" style="cursor:pointer"><div id="yt-player"></div><div id="yt-player-2" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px"></div><img id="np-thumb" alt=""></div>
      <div class="np-info" title="Full screen" onclick="openFullNP()" style="cursor:pointer">
        <div class="np-title" id="np-title">—</div>
        <div class="np-artist" id="np-artist">Nothing playing</div>
      </div>
      <button class="np-btn" id="np-add" title="Add to playlist" onclick="addCurrentToPlaylist(event)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>
      </button>
      <button class="np-btn" id="np-like" title="Save to Liked Songs" onclick="toggleLikeCurrent()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </button>
    </div>

    <div class="np-center">
      <div class="controls">
        <button id="btn-shuffle" title="Shuffle" onclick="toggleShuffle()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3l4 4-4 4V8h-2.5l-2.6 3.7-1.3-1.8L12.9 6H17V3zM3 6h4.5l9 13H21v-3l4 4-4 4v-3h-5.5l-9-13H3V6z"/></svg>
        </button>
        <button title="Previous" onclick="playPrev()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h2v16H6zM20 4L9 12l11 8z"/></svg>
        </button>
        <button class="btn-play" id="btn-play" title="Play" onclick="togglePlay()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="play-ico"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button title="Next" onclick="playNext()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 4h2v16h-2zM4 4l11 8L4 20z"/></svg>
        </button>
        <button id="btn-repeat" title="Repeat" onclick="toggleRepeat()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>
      <div class="progress">
        <span class="t" id="cur-time">0:00</span>
        <div class="bar" id="seek"><div class="fill" id="seek-fill"></div><div class="knob" id="seek-knob"></div></div>
        <span class="t" id="dur-time">0:00</span>
      </div>
    </div>

    <div class="np-right">
      <button class="now-btn" id="btn-lyrics" title="Lyrics / full screen" onclick="openFullNP()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4zM4 9h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg>
      </button>
      <button class="now-btn" id="btn-queue" title="Queue" onclick="openQueue()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6 4 3-4 3z"/></svg>
      </button>
      <button class="now-btn" id="btn-more" title="More (sleep timer, speed…)" onclick="nowMoreMenu(event)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div class="vol">
        <button class="now-btn" id="vol-ico" title="Mute" onclick="toggleMute()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13 3a4 4 0 00-2-3.5v7A4 4 0 0016 12z"/></svg>
        </button>
        <div class="bar" id="vol"><div class="fill" id="vol-fill" style="width:100%"></div><div class="knob" id="vol-knob"></div></div>
      </div>
    </div>
  </footer>
</div>

<script>
/* ============================================================
   Freefy — standalone Spotify-style player.
   Catalog: YouTube Data API v3, with a keyless Piped fallback
   when the daily quota runs out. Playback: YouTube IFrame player.
   Everything (key, likes, playlists, search results) persists in
   this browser's localStorage. Nothing needs a server.
   ============================================================ */

const K = {keys:'freefy_yt_api_keys', keyMeta:'freefy_key_meta', legacy:'freefy_yt_api_key',
           liked:'freefy_liked', pls:'freefy_playlists', cache:'freefy_cache',
           history:'freefy_history', searches:'freefy_searches', lyricfx:'freefy_lyricfx',
           shuffleMap:'freefy_shuffle_map', customLyrics:'freefy_custom_lyrics',
           trackFx:'freefy_trackfx', taps:'freefy_taps'};
const API = 'https://www.googleapis.com/youtube/v3';
// Public Piped instances, used for album search (always) and as a fallback for songs/artists
// once every key is exhausted. Tried in order. Most public instances rot fast — checked against
// the live registry at https://piped-instances.kavin.rocks, which currently lists exactly one
// healthy, CORS-enabled instance; the others here previously (kavin.rocks, adminforge.de,
// leptons.xyz, privacy.com.de) were all down (502s / broken redirects), which is why album
// search felt random — most requests were burning through 4 dead hosts before reaching this one.
const PIPED = ['https://api.piped.private.coffee'];
const CACHE_MAX = 500; // most-recent searches kept in persistent storage

// Multiple API keys form a pool: used in order, each falls back to the next
// once it hits its daily quota. (Migrates an old single-key install.)
let apiKeys   = load(K.keys, null);
if(!apiKeys){ const old=localStorage.getItem(K.legacy); apiKeys = old?[old]:[]; localStorage.setItem(K.keys,JSON.stringify(apiKeys)); }
let keyMeta   = load(K.keyMeta, {});   // { "<key>": {out:"YYYY-MM-DD", bad:true} }
let liked     = load(K.liked, []);
let playlists = load(K.pls, []);
let cache     = load(K.cache, {});
let shuffleMap = load(K.shuffleMap, {});     // { playlistId | 'liked': true/false } — per-playlist shuffle
let customLyrics = load(K.customLyrics, {}); // { trackId: raw LRC/plain text }, overrides LRCLIB

let queue=[], qIndex=-1, player=null, ytReady=false;
let shuffleOrder=[], shufflePos=-1;   // shuffled pass: track ids in play order, and where we are in it
let curType='song', lastQuery='', isPlaying=false, shuffle=false, repeat=0, seeking=false;
let history  = load(K.history, []);   // recently played tracks
let searches = load(K.searches, []);  // recent search queries
let lyrics=null, lyricIdx=-1;         // parsed lyrics of current track
let volume=100, muted=false, prevVol=100, playbackRate=1, sleepHandle=null;
let nowContext=null;   // which library item ('liked' | playlistId | null) is playing
let lyricSettings=load(K.lyricfx,{mode:'scroll',bg:'liquid',align:'left',size:1,glow:true,react:1});
// one-time move of existing installs onto the new liquid stage (they can switch back in Style)
if(!lyricSettings.v2){ lyricSettings.v2=1; if(lyricSettings.bg==='ambient') lyricSettings.bg='liquid'; if(lyricSettings.react==null) lyricSettings.react=1;
  localStorage.setItem(K.lyricfx,JSON.stringify(lyricSettings)); }
let trackFx = load(K.trackFx, {});   // { videoId: {dz:{cover..}|null, bpm:n, pa:{groove}|null, ts} } — per-track visuals, all derived
let taps    = load(K.taps, {});      // { videoId: {bpm, phase, bar} } — beat grids the user tapped in themselves
let navDir=0;                        // +1 next / -1 previous / 0 picked: which way the 3D cover should travel
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const el = (t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};
const esc = s => (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function decode(s){const t=el('textarea');t.innerHTML=s||'';return t.value;}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def;}catch(e){return def;}}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec||0));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
function cleanTitle(t){return decode(t).replace(/\s*[\(\[][^)\]]*(official|lyric|audio|video|mv|m\/v|visualizer|hd|4k)[^)\]]*[\)\]]/gi,'').trim();}
/* YouTube video thumbnails default to 4:3 hqdefault (black letterbox bars). For a
   song (11-char video id) use mqdefault (16:9, no bars) cropped to a square; use
   maxresdefault for big art. Album/artist ids aren't 11 chars → keep their cover. */
function tImg(t){ return (t&&/^[\w-]{11}$/.test(t.id||'')) ? 'https://i.ytimg.com/vi/'+t.id+'/mqdefault.jpg' : ((t&&t.thumb)||''); }
function tImgHi(t){ return (t&&/^[\w-]{11}$/.test(t.id||'')) ? 'https://i.ytimg.com/vi/'+t.id+'/maxresdefault.jpg' : ((t&&t.thumb)||''); }

/* Keep results that look like real songs (à la Spotify / YouTube Music) and drop
   reactions, covers, live clips, sped-up edits, hour-long mixes, etc. Then rank
   the "actual song" sources first: "- Topic" (YT Music audio) > VEVO > Official. */
const JUNK=/(\breaction\b|\breacts\b|live at |live from |live performance|live session|\(live\b|karaoke|cover by |sped ?up|slowed|nightcore|\b8d\b|\d+\s*hours?\b|full album|mega ?mix|\bdj mix\b|tutorial|guitar lesson|piano lesson|behind the scenes|making of|\bamv\b|documentary|teaser|trailer|\bvlog\b|podcast)/i;
function trackScore(t){const ch=t.artist||'',ti=t.title||''; let s=0;
  if(/ - topic$/i.test(ch)) s+=5; else if(/vevo/i.test(ch)) s+=2; else if(/official/i.test(ch)) s+=1;
  if(/official audio/i.test(ti)) s+=2; if(/official (music )?video/i.test(ti)) s-=0.5;
  return s;}
function refineSongs(items){
  let f=items.filter(t=>!JUNK.test(t.title||''));
  if(!f.length) f=items.slice();                          // never return an empty list
  return f.map((t,i)=>({t,s:trackScore(t),i})).sort((a,b)=>b.s-a.s||a.i-b.i).map(x=>x.t);
}
/* Official albums only: YouTube Music auto-generates exactly one playlist per real
   album release, and those (and only those) have ids beginning "OLAK5uy_". Fan /
   random-uploader playlists never do, so this drops every unofficial "album". */
function refineAlbums(items){ return items.filter(a=>/^OLAK5uy_/.test(a.id||'')); }
function persistLiked(){localStorage.setItem(K.liked,JSON.stringify(liked));scheduleBackup();}
function persistPls(){localStorage.setItem(K.pls,JSON.stringify(playlists));scheduleBackup();}
function persistShuffleMap(){localStorage.setItem(K.shuffleMap,JSON.stringify(shuffleMap));}
function persistCustomLyrics(){localStorage.setItem(K.customLyrics,JSON.stringify(customLyrics));scheduleBackup();}
function persistCache(){
  try{localStorage.setItem(K.cache,JSON.stringify(cache));}
  catch(e){ // storage full: drop the oldest half and retry once
    const ks=Object.keys(cache).sort((a,b)=>cache[a].ts-cache[b].ts);
    ks.slice(0,Math.ceil(ks.length/2)).forEach(k=>delete cache[k]);
    try{localStorage.setItem(K.cache,JSON.stringify(cache));}catch(_){}
  }
}

/* ---------- API key pool ---------- */
/* today's date in US-Pacific (YouTube quota reset boundary) */
function todayPT(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});}
function saveKeyMeta(){localStorage.setItem(K.keyMeta,JSON.stringify(keyMeta));}
function keyState(k){const m=keyMeta[k]; if(!m)return 'ok'; if(m.bad)return 'bad'; if(m.out===todayPT())return 'out'; return 'ok';}
function availableKeys(){return apiKeys.filter(k=>keyState(k)==='ok');}
function markKeyOut(k){keyMeta[k]=Object.assign({},keyMeta[k],{out:todayPT()});saveKeyMeta();}
function markKeyBad(k){keyMeta[k]=Object.assign({},keyMeta[k],{bad:true});saveKeyMeta();}
/* Run a YouTube task across the key pool. Returns the result, or null if no key
   works (caller then falls back to Piped). Each key that 403s on quota is parked
   until tomorrow; an invalid key is parked until re-saved. */
async function withKeys(task){
  for(const key of availableKeys()){
    try{ return await task(key); }
    catch(e){
      if(e.message==='QUOTA'){ markKeyOut(key); continue; }
      if(isKeyErr(e)){ markKeyBad(key); continue; }
      return null; // network/other error: stop and let caller fall back
    }
  }
  return null;
}
async function ytOrPiped(ytTask, pipedTask){
  const res = await withKeys(ytTask);
  if(res) return {items:res, source:'youtube'};
  if(apiKeys.length) flashFallback('All keys used up for today');
  return {items:await pipedTask(), source:'piped'};
}

/* ============================================================
   DATA LAYER — persistent cache → YouTube → Piped fallback
   Track object: {id, title, artist, thumb}
   Entity: {kind:'song'|'artist'|'album', id, title, sub, thumb}
   ============================================================ */
function cacheGet(k){const e=cache[k]; if(e){e.ts=Date.now(); return e.items;} return null;}
function cacheSet(k,items){
  cache[k]={items,ts:Date.now()};
  const ks=Object.keys(cache);
  if(ks.length>CACHE_MAX){ks.sort((a,b)=>cache[a].ts-cache[b].ts).slice(0,ks.length-CACHE_MAX).forEach(x=>delete cache[x]);}
  persistCache();
}

async function dataSearch(q,type,force){
  const ck='s|'+type+'|'+q.toLowerCase().trim();
  if(!force){const c=cacheGet(ck); if(c) return {items:c,source:'saved'};}
  const r=await fetchSearch(q,type);
  cacheSet(ck,r.items);
  return r;
}
async function dataEntityTracks(it,force){
  const raw=!!it.raw;
  const ck='e|'+it.kind+'|'+(raw?'raw|':'')+it.id;
  if(!force){const c=cacheGet(ck); if(c) return c;}
  const {items}=await ytOrPiped(
    key => it.kind==='artist' ? ytChannelUploads(it.id,key,raw) : ytPlaylistItems(it.id,key),
    ()  => it.kind==='artist' ? pipedArtistTracks(it.id,raw)    : pipedAlbumTracks(it.id)
  );
  cacheSet(ck,items);
  return items;
}
async function fetchSearch(q,type){
  /* Official YT-Music album playlists (id prefix "OLAK5uy_") are never surfaced by
     the regular YouTube Data API's playlist search, no matter the query or result
     count — confirmed empirically, they simply aren't in that index. Piped queries
     YouTube Music's own search instead, which does return them. So albums always
     go through Piped; API keys are only useful for song/artist search. */
  if(type==='album') return {items:await pipedSearch(q,type), source:'piped'};
  return ytOrPiped(key=>ytSearch(q,type,key), ()=>pipedSearch(q,type));
}
function isKeyErr(e){return e.message!=='QUOTA' && /api key|keyinvalid|not valid|forbidden|disabled|badrequest/i.test(e.message);}

/* ---------- YouTube Data API ---------- */
async function ytSearch(q,type,key){
  const map={song:'video',artist:'channel',album:'playlist'};
  const p=new URLSearchParams({key,part:'snippet',q,type:map[type],maxResults:'24'});
  if(type==='song')p.set('videoCategoryId','10');
  const res=await fetch(`${API}/search?${p}`); if(!res.ok) throw await apiError(res);
  const d=await res.json();
  const items=(d.items||[]).map(it=>mapYT(it,type)).filter(Boolean);
  if(type==='song')  return refineSongs(items);
  if(type==='album') return refineAlbums(items);
  return items;
}
/* raw: a channel opened from a pasted link is browsed as-is - no music-category
   pin, no song refining - because the whole point of the link was that channel's
   own uploads, which the filters would have thrown away. */
async function ytChannelUploads(channelId,key,raw){
  const p=new URLSearchParams({key,part:'snippet',channelId,type:'video',order:raw?'date':'viewCount',maxResults:'24'});
  if(!raw) p.set('videoCategoryId','10');
  const res=await fetch(`${API}/search?${p}`); if(!res.ok) throw await apiError(res);
  const d=await res.json();
  const items=(d.items||[]).map(it=>mapYT(it,'song')).filter(Boolean);
  return raw?items:refineSongs(items);
}
async function ytPlaylistItems(playlistId,key){
  const p=new URLSearchParams({key,part:'snippet',playlistId,maxResults:'50'});
  const res=await fetch(`${API}/playlistItems?${p}`); if(!res.ok) throw await apiError(res);
  const d=await res.json();
  return (d.items||[]).map(it=>{
    const sn=it.snippet, vid=sn.resourceId&&sn.resourceId.videoId;
    if(!vid||sn.title==='Deleted video'||sn.title==='Private video') return null;
    return {id:vid,title:cleanTitle(sn.title),artist:decode(sn.videoOwnerChannelTitle||''),thumb:thumbOf(sn)};
  }).filter(Boolean);
}
function thumbOf(sn){const t=sn.thumbnails||{};return (t.high||t.medium||t.default||{}).url||'';}
function mapYT(it,type){
  const sn=it.snippet;
  if(type==='song'){const id=it.id.videoId; if(!id)return null;
    return {kind:'song',id,title:cleanTitle(sn.title),artist:decode(sn.channelTitle),thumb:thumbOf(sn)};}
  if(type==='artist'){const id=it.id.channelId; if(!id)return null;
    return {kind:'artist',id,title:decode(sn.title),sub:decode(sn.description)||'Artist',thumb:thumbOf(sn)};}
  if(type==='album'){const id=it.id.playlistId; if(!id)return null;
    return {kind:'album',id,title:decode(sn.title),sub:decode(sn.channelTitle),thumb:thumbOf(sn)};}
}
async function apiError(res){
  let msg='Request failed ('+res.status+').';
  try{const j=await res.json();
    if(j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason==='quotaExceeded') return new Error('QUOTA');
    if(j.error&&j.error.message) msg=j.error.message;
  }catch(e){}
  return new Error(msg);
}

/* ---------- Piped (keyless fallback) ---------- */
function fetchT(url,ms){return Promise.race([fetch(url),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);}
async function pipedFetch(path,ms){
  for(const base of PIPED){
    try{const r=await fetchT(base+path,ms||7000); if(r.ok) return await r.json();}catch(e){}
  }
  throw new Error('The free backup servers are all unreachable right now. Add a YouTube API key for reliable results, or try again later.');
}
const vidId  = u=>{const m=(u||'').match(/[?&]v=([^&]+)/)||(u||'').match(/\/watch\/([^/?&]+)/); return m?m[1]:null;};
const chanId = u=>{const m=(u||'').match(/\/channel\/([^/?&]+)/); return m?m[1]:null;};
const listId = u=>{const m=(u||'').match(/[?&]list=([^&]+)/); return m?m[1]:null;};
async function pipedSearch(q,type){
  const filter={song:'music_songs',artist:'music_artists',album:'music_albums'}[type];
  const d=await pipedFetch(`/search?q=${encodeURIComponent(q)}&filter=${filter}`);
  const items=(d.items||[]).map(it=>mapPiped(it,type)).filter(Boolean);
  if(type==='song')  return refineSongs(items);
  if(type==='album') return refineAlbums(items);
  return items;
}
function mapPiped(it,type){
  if(type==='song'){const id=vidId(it.url); if(!id)return null;
    return {kind:'song',id,title:cleanTitle(it.title),artist:it.uploaderName||'',thumb:it.thumbnail||''};}
  if(type==='artist'){const id=chanId(it.url); if(!id)return null;
    return {kind:'artist',id,title:it.name||it.title,sub:it.description||'Artist',thumb:it.thumbnail||''};}
  if(type==='album'){const id=listId(it.url); if(!id)return null;
    return {kind:'album',id,title:it.name||it.title,sub:it.uploaderName||'',thumb:it.thumbnail||''};}
}
function streamToTrack(s){const id=vidId(s.url); if(!id)return null;
  return {id,title:cleanTitle(s.title),artist:s.uploaderName||'',thumb:s.thumbnail||''};}
async function pipedArtistTracks(id,raw){const d=await pipedFetch('/channel/'+id); const items=(d.relatedStreams||[]).map(streamToTrack).filter(Boolean); return raw?items:refineSongs(items);}
async function pipedAlbumTracks(id){const d=await pipedFetch('/playlists/'+id); return (d.relatedStreams||[]).map(streamToTrack).filter(Boolean);}

/* Coverflow: the recently played shelf as a row of 3D sleeves. Wheel sideways, drag,
   arrow keys or click a side cover to bring it to the middle; click the middle one to play. */
function coverFlow(tracks){
  const wrap=el('div','flow'); wrap.tabIndex=0;
  wrap.innerHTML=`<div class="flow-stage"></div><div class="flow-cap"><div class="ft"></div><div class="fa"></div></div>
    <button class="flow-nav prev" title="Previous">‹</button><button class="flow-nav next" title="Next">›</button>`;
  const stage=wrap.querySelector('.flow-stage'), cap=wrap.querySelector('.flow-cap');
  const f={pos:-2.5,target:0,vel:0,raf:0,shown:-1,drag:null,moved:false,acc:0};
  const play=t=>{queue=[trim(t)];qIndex=0;setContext(null);playCurrent();};
  const items=tracks.map((t,i)=>{
    const it=el('div','fl-item'); it.dataset.id=t.id;
    it.innerHTML=`<div class="fl-art"><img src="${esc(artSync(t,'m'))}" draggable="false" onerror="this.src='${esc(tImg(t))}'">
      <button class="fl-play" title="Play"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div>`;
    it.onclick=()=>{ if(f.moved) return; if(Math.round(f.target)===i) play(t); else { f.target=i; kick(); } };
    it.oncontextmenu=e=>{e.preventDefault();trackContextMenu(t,e.clientX,e.clientY,{});};
    stage.appendChild(it); return it;
  });
  function layout(){
    items.forEach((it,i)=>{
      const o=i-f.pos, a=Math.abs(o), sg=Math.sign(o), n=Math.min(a,1), far=Math.max(0,a-1);
      it.style.transform=`translate3d(${sg*(n*168+far*74)}px,0,${-n*180-far*34}px) rotateY(${-sg*n*54}deg)`;
      it.style.zIndex=100-Math.round(a*10);
      it.style.opacity=a>6.5?Math.max(0,7.5-a):1;
      it.style.filter=`brightness(${1-n*.32-Math.min(far,4)*.04})`;
      it.classList.toggle('center',a<.5);
    });
    const c=Math.max(0,Math.min(items.length-1,Math.round(f.pos)));
    if(c!==f.shown){ f.shown=c; cap.querySelector('.ft').textContent=tracks[c].title; cap.querySelector('.fa').textContent=tracks[c].artist||''; }
  }
  function tick(){
    const d=f.target-f.pos; f.vel=f.vel*.74+d*.12; f.pos+=f.vel; layout();
    if(Math.abs(d)<.002&&Math.abs(f.vel)<.002&&!f.drag){ f.pos=f.target; layout(); f.raf=0; return; }
    f.raf=requestAnimationFrame(tick);
  }
  function kick(){ if(!f.drag) f.target=Math.max(0,Math.min(items.length-1,Math.round(f.target))); if(!f.raf) f.raf=requestAnimationFrame(tick); }
  wrap.querySelector('.prev').onclick=e=>{e.stopPropagation();f.target--;kick();};
  wrap.querySelector('.next').onclick=e=>{e.stopPropagation();f.target++;kick();};
  wrap.addEventListener('keydown',e=>{ if(e.code==='ArrowLeft'){f.target--;kick();e.preventDefault();} if(e.code==='ArrowRight'){f.target++;kick();e.preventDefault();}
    if(e.code==='Enter'){ play(tracks[Math.round(f.target)]); } });
  // sideways wheel / trackpad swipe only — vertical scroll keeps scrolling the page
  wrap.addEventListener('wheel',e=>{ const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0); if(!d) return;
    e.preventDefault(); f.acc+=d; if(Math.abs(f.acc)>45){ f.target+=Math.sign(f.acc); f.acc=0; kick(); } },{passive:false});
  stage.addEventListener('pointerdown',e=>{ if(e.button!==0) return; f.drag={x0:e.clientX,t0:f.target,last:e.clientX,lt:performance.now(),v:0,id:e.pointerId}; f.moved=false; });
  stage.addEventListener('pointermove',e=>{ const d=f.drag; if(!d) return; const dx=e.clientX-d.x0;
    // capture only once it is really a drag, so a plain click still lands on the cover it hit
    if(!f.moved&&Math.abs(dx)>5){ f.moved=true; try{stage.setPointerCapture(d.id);}catch(_){} }
    if(!f.moved) return;
    const now=performance.now(); d.v=(e.clientX-d.last)/Math.max(1,now-d.lt); d.last=e.clientX; d.lt=now;
    f.target=Math.max(-.4,Math.min(items.length-.6,d.t0-dx/130)); if(!f.raf) f.raf=requestAnimationFrame(tick); });
  const end=()=>{ const d=f.drag; if(!d) return; f.drag=null; if(f.moved){ f.target-=d.v*2.2; kick(); } setTimeout(()=>{f.moved=false;},0); };
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  layout(); kick();
  return wrap;
}

/* ============================================================
   PASTE-A-LINK  (escape hatch out of the "real songs" filters)
   ------------------------------------------------------------
   Song search is deliberately narrow: ytSearch pins videoCategoryId=10 and
   refineSongs drops reactions/covers/live/etc, so a one-off upload by a random
   channel is unreachable by keyword. Pasting its URL bypasses both filters and
   plays the exact video. Resolving one video costs 1 quota unit (a search costs
   100), and the result is cached, so re-pasting the same link is free. */
const LINK_RE = /(?:youtube\.com|youtu\.be|youtube-nocookie\.com)/i;
function parseYTLink(raw){
  const s=(raw||'').trim();
  if(/^[\w-]{11}$/.test(s)) return {kind:'song',id:s,bare:true}; // maybe a bare video id
  if(!LINK_RE.test(s)) return null;
  let u; try{ u=new URL(s.startsWith('http')?s:'https://'+s); }catch(e){ return null; }
  const host=u.hostname.replace(/^www\./,''), path=u.pathname, qp=u.searchParams;
  const ok=id=>/^[\w-]{11}$/.test(id||'');

  // youtu.be/ID
  if(host==='youtu.be'){ const id=path.slice(1).split('/')[0]; if(ok(id)) return {kind:'song',id}; }
  // /watch?v=ID  (a &list= alongside it is ignored — the video is what was linked)
  if(ok(qp.get('v'))) return {kind:'song',id:qp.get('v')};
  // /shorts/ID, /embed/ID, /live/ID, /v/ID
  const m=path.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/); if(m) return {kind:'song',id:m[1]};
  // /playlist?list=ID  (or any bare list= with no video)
  const list=qp.get('list'); if(list) return {kind:'album',id:list,title:'Playlist'};
  // /channel/UC...
  const ch=path.match(/^\/channel\/([\w-]+)/); if(ch) return {kind:'artist',id:ch[1],title:'Channel'};
  // /@handle, /c/name, /user/name — no id in the URL, so fall back to a name search
  const h=path.match(/^\/(?:@([^/?]+)|c\/([^/?]+)|user\/([^/?]+))/);
  if(h) return {kind:'handle',q:decodeURIComponent(h[1]||h[2]||h[3])};
  return null;
}

/* Metadata for one video id: key pool (1 unit) -> Piped -> YouTube oEmbed.
   oEmbed is keyless, CORS-enabled and quota-free, so a link still resolves with
   no API key at all and even when every key is spent. */
async function ytVideoMeta(id,key){
  const p=new URLSearchParams({key,part:'snippet',id});
  const res=await fetch(`${API}/videos?${p}`); if(!res.ok) throw await apiError(res);
  const d=await res.json(); const it=(d.items||[])[0];
  if(!it) throw new Error('That video is unavailable (deleted, private, or the link is wrong).');
  return {id,title:cleanTitle(it.snippet.title),artist:decode(it.snippet.channelTitle||''),thumb:thumbOf(it.snippet)};
}
async function pipedVideoMeta(id){
  const d=await pipedFetch('/streams/'+id,7000);
  if(!d||!d.title) throw new Error('That video is unavailable (deleted, private, or the link is wrong).');
  return {id,title:cleanTitle(d.title),artist:d.uploader||'',thumb:d.thumbnailUrl||''};
}
async function oembedVideoMeta(id){
  const r=await fetchT('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id),7000);
  if(!r.ok) throw new Error('That video is unavailable (deleted, private, or the link is wrong).');
  const d=await r.json();
  return {id,title:cleanTitle(d.title||''),artist:decode(d.author_name||''),thumb:d.thumbnail_url||''};
}
async function resolveVideo(id,force){
  const ck='v|'+id;
  if(!force){const c=cacheGet(ck); if(c&&c[0]) return {track:c[0],source:'saved'};}
  let track=await withKeys(k=>ytVideoMeta(id,k)), source='youtube';
  if(!track){ try{ track=await pipedVideoMeta(id); source='piped'; }catch(e){} }
  if(!track){ track=await oembedVideoMeta(id); source='piped'; }   // throws if truly gone
  cacheSet(ck,[track]);
  return {track,source};
}
/* Title for a pasted playlist link, so the header isn't just "Playlist". */
async function resolveListTitle(id){
  const via=await withKeys(async key=>{
    const res=await fetch(`${API}/playlists?${new URLSearchParams({key,part:'snippet',id})}`);
    if(!res.ok) throw await apiError(res);
    const it=((await res.json()).items||[])[0];
    return it?{title:decode(it.snippet.title),sub:decode(it.snippet.channelTitle||''),thumb:thumbOf(it.snippet)}:null;
  });
  if(via) return via;
  try{ const d=await pipedFetch('/playlists/'+id,7000);
       return {title:d.name||'Playlist',sub:d.uploader||'',thumb:d.thumbnailUrl||''}; }catch(e){}
  return {title:'Playlist',sub:'',thumb:''};
}

/* Name/avatar for a pasted channel link, so the header isn't a bare "Channel". */
async function resolveChannelMeta(id){
  const via=await withKeys(async key=>{
    const res=await fetch(`${API}/channels?${new URLSearchParams({key,part:'snippet',id})}`);
    if(!res.ok) throw await apiError(res);
    const it=((await res.json()).items||[])[0];
    return it?{title:decode(it.snippet.title),sub:'Channel',thumb:thumbOf(it.snippet)}:null;
  });
  if(via) return via;
  try{ const d=await pipedFetch('/channel/'+id,7000);
       return {title:d.name||'Channel',sub:'Channel',thumb:d.avatarUrl||''}; }catch(e){}
  return {title:'Channel',sub:'',thumb:''};
}

async function runLink(link,force){
  loading();
  try{
    if(link.kind==='handle'){                       // no id in the URL: search the name
      curType='artist';
      document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.type==='artist'));
      $('#search').value=link.q; return runSearch(force);
    }
    if(link.kind==='song'){
      const {track,source}=await resolveVideo(link.id,force);
      viewTitle=track.title; updateTitle();
      renderLinkedTrack(track,source);
      queue=[trim(track)]; qIndex=0; setContext(null); playCurrent();
      return;
    }
    if(link.kind==='album'){
      const meta=await resolveListTitle(link.id);
      return openEntity({kind:'album',id:link.id,title:meta.title,sub:meta.sub,thumb:meta.thumb},force);
    }
    if(link.kind==='artist'){
      // raw:true — a linked channel is browsed as-is, not filtered down to music
      const cm=await resolveChannelMeta(link.id);
      return openEntity({kind:'artist',id:link.id,title:cm.title,sub:cm.sub,thumb:cm.thumb,raw:true},force);
    }
  }catch(e){
    // A bare 11-char string that didn't resolve was just a word ("Evanescence").
    if(link.bare) return runSearch(force,true);
    renderError(e);
  }
}
function renderLinkedTrack(track,source){
  setActiveNav('search'); setActiveLib(null);
  content.innerHTML=`<div class="section-title">From link</div>`+sourceBadge(source)+
    `<div class="source-badge" style="margin-top:-6px">Filters skipped — this plays the exact video you linked.</div>`;
  const rows=el('div','rows'); rows.appendChild(trackRow(track,0,[track])); content.appendChild(rows);
  enterView();
}

async function runSearch(force,skipLink){
  const q=$('#search').value.trim();
  if(!q){showHome();return;}
  const link=skipLink?null:parseYTLink(q);
  if(link&&link.kind!=='handle'){ lastQuery=q; pushSearch(q); return runLink(link,force); }
  if(link) return runLink(link,force);          // handle: rewrites the box, re-enters here
  lastQuery=q; pushSearch(q); viewTitle='Search · '+q; updateTitle(); setActiveNav('search'); setActiveLib(null); loading();
  try{
    const {items,source}=await dataSearch(q,curType,force);
    renderResults(items,q,source);
  }catch(e){renderError(e);}
}
function sourceBadge(source){
  const map={
    saved:'⚡ Instant — from your saved results (no API call)',
    youtube:'Source: YouTube',
    piped:'🔁 Free backup source (quota not used)'
  };
  return `<div class="source-badge">${map[source]||''}<span class="refresh" onclick="runSearch(true)" title="Fetch fresh results">↻ refresh</span></div>`;
}
function renderResults(items,q,source){
  if(!items.length){content.innerHTML=`<div class="center-msg"><h2>No results for "${esc(q)}"</h2></div>`;return;}
  content.innerHTML=`<div class="section-title">${curType==='song'?'Songs':curType==='artist'?'Artists':'Albums'} · "${esc(q)}"</div>`+sourceBadge(source);
  if(curType==='song'){
    const rows=el('div','rows'); items.forEach((it,i)=>rows.appendChild(trackRow(it,i,items))); content.appendChild(rows);
  }else{
    const grid=el('div','grid'); items.forEach((it,i)=>{const c=card(it);c.style.setProperty('--i',Math.min(i,24));grid.appendChild(c);}); content.appendChild(grid);

}

      ${(opts.removeFrom||opts.onRemove)?`<button class="r-remove" title="Remove"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5z"/></svg></button>`:''}
    </div>`;
  if(opts.reorder) row.style.gridTemplateColumns='auto 32px 1fr auto';
  row.onclick=()=>{
    if(!opts.noReplace){ queue=listContext.slice(); setContext(opts.context!==undefined?opts.context:null); }
    qIndex=i; playCurrent();
  };
  row.oncontextmenu=e=>{e.preventDefault();trackContextMenu(it,e.clientX,e.clientY,opts);};

  if(opts.reorder){row.querySelector('.mv-up').onclick=e=>{e.stopPropagation();opts.onMove(i,-1);};row.querySelector('.mv-dn').onclick=e=>{e.stopPropagation();opts.onMove(i,1);};}
  return row;
}

async function openEntity(it,force){
  if(it.kind==='song'){queue=[it];qIndex=0;setContext(null);playCurrent();return;}

function renderEntity(it,tracks){
  viewTitle=it.title; updateTitle();

  const bar=el('div'); bar.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px';

  const addPl=el('button','btn btn-ghost'); addPl.textContent='＋ Add all to playlist';

  addQ.onclick=()=>{tracks.forEach(t=>queue.push(trim(t)));if(qIndex<0){qIndex=0;playCurrent();}toast(tracks.length+' added to queue');};

function renderError(e){

  content.innerHTML=`<div class="quota-warn"><b>Couldn't load.</b> ${esc(e.message)}</div>`;

}

/* ============================================================
   PLAYLISTS + LIKED (persistent library)
   ============================================================ */
const HEART_SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';
function eqHTML(){return '<span class="eq"><i></i><i></i><i></i></span>';}
function libItem(id,title,sub,coverHTML,onClick){
  const it=el('div','lib-item'); it.dataset.lib=id;
  it.innerHTML=coverHTML+`<div class="li-meta"><div class="li-title">${esc(title)}</div><div class="li-sub">${esc(sub)}</div></div>`+((nowContext===id&&isPlaying)?eqHTML():'');
  it.onclick=onClick; return it;
}
function renderLibrary(){
  const box=$('#lib-list'); box.innerHTML='';
  box.appendChild(libItem('liked','Liked Songs','Playlist · '+liked.length+' songs',`<div class="lib-cover heart">${HEART_SVG}</div>`,openLiked));
  // Most-recently-played playlists first
  playlists.slice().sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0)).forEach(p=>{
    const cov=plCover(p)?`<div class="lib-cover"><img src="${esc(plCover(p))}" onerror="this.style.opacity=0"></div>`
                         :`<div class="lib-cover"><svg width="18" height="18" viewBox="0 0 24 24" fill="#888"><path d="M12 3v10.6A4 4 0 1014 17V7h4V3z"/></svg></div>`;
    box.appendChild(libItem(p.id,p.name,'Playlist · '+p.tracks.length+' songs',cov,()=>openPlaylist(p.id)));
  });
}
function setActiveLib(id){document.querySelectorAll('.lib-item').forEach(i=>i.classList.toggle('active',i.dataset.lib===id));}
/* update the currently-playing library indicator */
function setContext(ctx){
  nowContext=ctx;
  if(ctx&&ctx!=='liked'){ const p=playlists.find(x=>x.id===ctx); if(p){p.lastPlayed=Date.now();persistPls();} }
  shuffle = ctx ? !!shuffleMap[ctx] : false; // shuffle is a per-playlist attribute; ad-hoc queues are never shuffled
  updateShuffleBtn();
  renderLibrary();
}
function updateShuffleBtn(){ const b=$('#btn-shuffle'); if(b) b.classList.toggle('on',shuffle); }
/* start playing a saved list (playlist/liked), honoring that list's own saved shuffle state
   for picking the first track — so turning shuffle on and hitting Play doesn't always start at 0 */
function playListFrom(tracks,ctx){
  if(!tracks||!tracks.length)return;
  queue=tracks.slice(); setContext(ctx);
  if(shuffle&&queue.length>1){ buildShuffleOrder(); qIndex=queue.findIndex(t=>t.id===shuffleOrder[0]); }
  else qIndex=0;
  playCurrent();
}
function refreshEq(){
  document.querySelectorAll('.lib-item').forEach(it=>{
    const on=(it.dataset.lib===nowContext)&&isPlaying, has=it.querySelector('.eq');
    if(on&&!has) it.insertAdjacentHTML('beforeend',eqHTML());
    else if(!on&&has) has.remove();
  });
}

function createPlaylist(seed){ promptNewPlaylist(p=>{ if(seed) addTracksToPlaylist(p.id,[seed]); else openPlaylist(p.id); }); }
function promptNewPlaylist(cb){
  showPrompt('New playlist','Playlist name','My Playlist #'+(playlists.length+1),name=>{
    const p={id:'pl_'+Date.now(),name:name||'Untitled Playlist',tracks:[],created:Date.now()};
    playlists.unshift(p); persistPls(); renderLibrary(); cb&&cb(p);
  });
}
function trim(t){return {id:t.id,title:t.title,artist:t.artist,thumb:t.thumb};}
function addToPlaylist(pid,track){addTracksToPlaylist(pid,[track]);}
function addTracksToPlaylist(pid,tracks){
  const p=playlists.find(x=>x.id===pid); if(!p)return;
  let n=0; tracks.forEach(t=>{ if(!p.tracks.some(x=>x.id===t.id)){p.tracks.push(trim(t));n++;} });
  persistPls(); renderLibrary();
  toast(n?`Added ${n} to ${p.name}`:'Already in '+p.name);
  const a=document.querySelector('.lib-item.active'); if(a&&a.dataset.lib===pid) openPlaylist(pid);
}
function renamePlaylist(id){
  const p=playlists.find(x=>x.id===id); if(!p)return;
  showPrompt('Rename playlist','Playlist name',p.name,name=>{ if(name){p.name=name;persistPls();renderLibrary();openPlaylist(id);} });
}
function movePlaylistTrack(id,i,dir){
  const p=playlists.find(x=>x.id===id); if(!p)return; const j=i+dir; if(j<0||j>=p.tracks.length)return;
  const t=p.tracks.splice(i,1)[0]; p.tracks.splice(j,0,t); persistPls(); openPlaylist(id);
}
/* pick an image file, cover-crop to a small square, return a compact data URL */
function pickImageFile(cb){
  const inp=el('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const S=320,cv=el('canvas'); cv.width=cv.height=S; const c=cv.getContext('2d');
      const sc=Math.max(S/img.width,S/img.height), w=img.width*sc, h=img.height*sc;
      c.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      cb(cv.toDataURL('image/jpeg',0.85));
    }; img.src=rd.result; };
    rd.readAsDataURL(f); };
  inp.click();
}
function changePlaylistCover(id){
  const p=playlists.find(x=>x.id===id); if(!p)return;
  pickImageFile(url=>{ p.cover=url; persistPls(); renderLibrary(); openPlaylist(id); toast('Cover updated'); });
}
function plCover(p){ return p.cover || (p.tracks[0]?artSync(p.tracks[0],'s'):''); }
function removeFromPlaylist(pid,trackId){
  const p=playlists.find(x=>x.id===pid); if(!p)return;
  p.tracks=p.tracks.filter(t=>t.id!==trackId); persistPls(); renderLibrary();
}
function deletePlaylist(pid){
  const p=playlists.find(x=>x.id===pid); if(!p)return;
  if(!confirm('Delete playlist "'+p.name+'"? This cannot be undone.')) return;
  playlists=playlists.filter(x=>x.id!==pid); persistPls(); renderLibrary(); showHome();
}
function openPlaylist(id){
  const p=playlists.find(x=>x.id===id); if(!p)return;
  const a=document.querySelector('.lib-item.active'); openPlaylist.same=!!(a&&a.dataset.lib===id&&content.querySelector('.rows,.side-empty'));
  setActiveNav(null); setActiveLib(id); viewTitle=p.name; updateTitle();
  content.innerHTML=headerHTML('Playlist',p.name,p.tracks.length+' songs · saved on this device',plCover(p),false);
  const bar=el('div'); bar.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px';
  const play=el('button','btn btn-green'); play.textContent='▶  Play'; play.onclick=()=>playListFrom(p.tracks,id);
  const addQ=el('button','btn btn-ghost'); addQ.textContent='Add all to queue'; addQ.onclick=()=>queueAll(p.tracks);
  const cov=el('button','btn btn-ghost'); cov.textContent='Change cover'; cov.onclick=()=>changePlaylistCover(id);
  const ren=el('button','btn btn-ghost'); ren.textContent='Rename'; ren.onclick=()=>renamePlaylist(id);
  const del=el('button','btn btn-danger'); del.textContent='Delete'; del.onclick=()=>deletePlaylist(id);
  bar.append(play,addQ,cov,ren,del); content.appendChild(bar);
  if(!p.tracks.length){content.innerHTML+=`<div class="side-empty">No songs yet. Search for music, then hit the ＋ on any track (or right-click → Add to playlist). Saved songs play with no API calls.</div>`;return;}
  const rows=el('div','rows'); p.tracks.forEach((t,i)=>rows.appendChild(trackRow(t,i,p.tracks,{removeFrom:id,reorder:true,context:id,onMove:(idx,dir)=>movePlaylistTrack(id,idx,dir)}))); content.appendChild(rows);
  if(!openPlaylist.same) enterView();
}
function openLiked(){

/* ============================================================
   PERMANENT AUTO-BACKUP — write the whole library to a real file on
   disk (File System Access API) and re-save on every change. Also asks
   the browser to make local storage persistent (won't be evicted).
   ============================================================ */
let backupHandle=null, pendingHandle=null, backupTimer=null;
const fsaSupported = 'showSaveFilePicker' in window;
function idbReq(fn){return new Promise((res,rej)=>{const r=indexedDB.open('freefy-db',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};
  r.onerror=()=>rej(r.error); r.onsuccess=()=>{try{fn(r.result,res,rej);}catch(e){rej(e);}};});}
function idbSet(k,v){return idbReq((db,res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
function idbGet(k){return idbReq((db,res,rej)=>{const tx=db.transaction('kv','readonly');const g=tx.objectStore('kv').get(k);g.onsuccess=()=>res(g.result);g.onerror=()=>rej(g.error);});}
function backupJSON(){return JSON.stringify({app:'freefy',version:2,savedAt:new Date().toISOString(),playlists,liked,searches,history,shuffleMap,customLyrics},null,2);}
async function connectBackup(){
  if(!fsaSupported){toast('This browser can’t auto-save to a file — use Export instead');return;}
  try{
    backupHandle=await window.showSaveFilePicker({suggestedName:'freefy-library.json',types:[{description:'Freefy library',accept:{'application/json':['.json']}}]});
    pendingHandle=null; try{await idbSet('backupHandle',backupHandle);}catch(e){}
    await writeBackupNow(); toast('Auto-save ON — your library now writes to that file'); updateBackupUI();
  }catch(e){ if(e&&e.name!=='AbortError') toast('Couldn’t set up auto-save'); }
}
async function writeBackupNow(){ if(!backupHandle)return; try{ const w=await backupHandle.createWritable(); await w.write(backupJSON()); await w.close(); }catch(e){ pendingHandle=backupHandle; backupHandle=null; updateBackupUI(); } }
function scheduleBackup(){ if(!backupHandle)return; clearTimeout(backupTimer); backupTimer=setTimeout(writeBackupNow,1200); }
async function reconnectBackup(){
  if(!pendingHandle) return connectBackup();
  try{ const p=await pendingHandle.requestPermission({mode:'readwrite'});
    if(p==='granted'){ backupHandle=pendingHandle; pendingHandle=null; await writeBackupNow(); toast('Auto-save reconnected ✓'); updateBackupUI(); } }catch(e){}
}
function backupClick(){ if(backupHandle){ writeBackupNow(); toast('Saved to file ✓'); } else if(pendingHandle){ reconnectBackup(); } else { connectBackup(); } }
/* Point auto-save at a file the user already has (e.g. from a previous session
   whose remembered file handle lost permission, or a backup made on another
   device) instead of forcing them through "Save As" and risking a brand-new
   file every time. Loads that file's library in first, so it becomes the
   thing being kept in sync rather than getting silently overwritten. */
async function openExistingBackup(){
  if(!fsaSupported){toast('This browser can’t auto-save to a file — use Export instead');return;}
  let h;
  try{ [h]=await window.showOpenFilePicker({types:[{description:'Freefy library',accept:{'application/json':['.json']}}]}); }
  catch(e){ if(e&&e.name!=='AbortError') toast('Couldn’t open that file'); return; }
  try{
    const perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ toast('Permission needed to auto-save to that file'); return; }
  }catch(e){ return; }
  try{
    const text=await (await h.getFile()).text(); const d=JSON.parse(text);
    if(d&&(Array.isArray(d.playlists)||Array.isArray(d.liked))&&confirm('Load the library saved in this file into Freefy? (Replaces what\'s currently loaded)')){
      if(Array.isArray(d.playlists)){playlists=d.playlists;persistPls();}
      if(Array.isArray(d.liked)){liked=d.liked;persistLiked();}
      if(Array.isArray(d.searches)){searches=d.searches;localStorage.setItem(K.searches,JSON.stringify(searches));}
      if(Array.isArray(d.history)){history=d.history;localStorage.setItem(K.history,JSON.stringify(history));}
      if(d.shuffleMap&&typeof d.shuffleMap==='object'){shuffleMap=d.shuffleMap;persistShuffleMap();}
      if(d.customLyrics&&typeof d.customLyrics==='object'){customLyrics=d.customLyrics;persistCustomLyrics();}
      renderLibrary();
    }
  }catch(e){ toast('That file isn\'t a valid Freefy backup — connecting anyway'); }
  backupHandle=h; pendingHandle=null; try{await idbSet('backupHandle',backupHandle);}catch(e){}
  await writeBackupNow(); toast('Auto-save ON — using that file'); updateBackupUI();
}
function updateBackupUI(){
  const b=$('#backup-btn'), o=$('#backup-open-btn'); if(!b)return;
  if(backupHandle){ b.textContent='💾 Auto-save: ON'; b.classList.add('on'); }
  else if(pendingHandle){ b.textContent='🔌 Reconnect auto-save'; b.classList.remove('on'); }
  else { b.textContent=fsaSupported?'💾 Auto-save to file: Off':'💾 Auto-save (use Export)'; b.classList.remove('on'); }
  if(o) o.style.display=(fsaSupported&&!backupHandle)?'':'none';
}
async function initBackup(){
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  if(fsaSupported){ try{ const h=await idbGet('backupHandle'); if(h){ const perm=await h.queryPermission({mode:'readwrite'}); if(perm==='granted') backupHandle=h; else pendingHandle=h; } }catch(e){} }
  updateBackupUI();
}

/* toast */
let toastT;
function toast(msg){let t=$('#toast'); if(!t){t=el('div','toast');t.id='toast';document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),1700);}
